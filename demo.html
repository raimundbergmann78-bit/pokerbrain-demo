  UTG: "22+,A2s+,K9s+,Q9s+,J9s+,T9s,98s,87s,76s,AJo+,KQo",
  HJ: "22+,A2s+,K7s+,Q9s+,J9s+,T8s+,98s,87s,76s,65s,ATo+,KJo+,QJo",
  CO: "22+,A2s+,K4s+,Q7s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A8o+,KTo+,QTo+,JTo",
  BTN: "22+,A2s+,K2s+,Q2s+,J5s+,T6s+,96s+,85s+,74s+,64s+,53s+,43s,A2o+,K8o+,Q9o+,J9o+,T8o+,98o,87o",
  SB: "22+,A2s+,K2s+,Q5s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A3o+,K9o+,QTo+,JTo,T9o",
};
function rangeLesen(text) {
  const r = new Set();
  for (const tok of text.split(",")) {
    const plus = tok.endsWith("+"), t = plus ? tok.slice(0, -1) : tok;
    const a = RAENGE.indexOf(t[0]), b = RAENGE.indexOf(t[1]), art = t[2] || "";
    if (a === b) { for (let i = plus ? 0 : a; i <= a; i++) r.add(RAENGE[i] + RAENGE[i]); continue; }
    for (let j = b; j > (plus ? a : b - 1); j--) r.add(RAENGE[a] + RAENGE[j] + art);
  }
  return r;
}
const RANGES = Object.fromEntries(Object.entries(DEMO_RANGES).map(([p, t]) => [p, rangeLesen(t)]));
const combos = h => h.length === 2 ? 6 : h[2] === "s" ? 4 : 12;
const prozent = p => (100 * [...RANGES[p]].reduce((s, h) => s + combos(h), 0) / 1326).toFixed(0);
function handName(c1, c2) {
  let [a, b] = [c1, c2].sort((x, y) => RAENGE.indexOf(x[0]) - RAENGE.indexOf(y[0]));
  if (a[0] === b[0]) return a[0] + b[0];
  return a[0] + b[0] + (a[1] === b[1] ? "s" : "o");
}

  return [deck[i], deck[j]];
}

        <h3>${esc(thema(s))}</h3>

SEITEN.session = id => {
  const s = S.sessions.find(x => x.id === +id);
  if (!s) return SEITEN.coaching();
  const b = S.buchungen[s.id], dabei = b && b.status === "bezahlt", istCoach = S.angemeldet && s.coach === S.nick;
  const rabatt = meinRabatt(), preise = coachingPreise();
  nachher = () => {
    document.querySelectorAll("[data-buchen]").forEach(k => k.onclick = () => buchen(s, k.dataset.buchen ? +k.dataset.buchen : null));
    const st = $("storno"); if (st) st.onclick = () => { if (confirm(T("coaching.storno.frage"))) stornieren(s); };
    const vs = $("vorspulen"); if (vs) vs.onclick = () => vorspulen(s);
    const dl = $("discordLink"); if (dl) dl.onclick = e => { e.preventDefault(); toast(T("demo.discordlink")); };
  };
  let unten = "";
  if (dabei) {
    unten = `<div class="karte dabei"><h2>✓ ${T("coaching.dabei")}</h2>
      <p>${T("coaching.bezahlt", euro(b.betrag - b.erstattet))}${b.rabatt ? ` (−${b.rabatt} %)` : ""}</p>
      ${b.erstattet ? `<p class="gut">↩ ${T("coaching.erstattet", euro(b.erstattet)).replace(/^[^–]*– /, "")}</p>` : ""}
      <a class="knopf gruen" href="#" id="discordLink">💬 ${T("coaching.discord")}</a>
      ${s.status === "geplant" ? `<div class="knopfreihe"><button class="knopf klein grau" id="storno">${T("coaching.storno")}</button>
        <button class="knopf klein gelb" id="vorspulen">${T("demo.vorspulen")}</button></div>` : ""}</div>`;
  } else if (b && b.status === "erstattet") {
    unten = `<div class="meldung ok">${T("coaching.erstattet", euro(b.erstattet))}</div>`;
  }
  if (!dabei && !istCoach && s.status === "geplant") {
    if (!buchbar(s)) unten += `<p class="hinweis">${T("coaching.err.voll")}</p>`;
    else if (!S.angemeldet) unten += `<a class="knopf gruen breit" href="#anmelden">${T("coaching.anmelden")}</a>`;
    else {
      unten += `<button class="knopf gruen breit gross-k" data-buchen="">${T("coaching.buchen", euro(preisFuer(s, rabatt)))}</button>`;
      for (const p of preise) {
        const geht = p.art === "woche" || s.gratisBelegt < s.gratis;
        unten += `<button class="knopf gelb breit" data-buchen="${p.id}" ${!geht || S.ausweis !== "bestaetigt" ? "disabled" : ""}>🏆 ${p.art === "monat" ? T("coaching.mit.gratis") : T("coaching.mit.halb", euro(preisFuer(s, 50)))}</button>`;
        if (S.ausweis !== "bestaetigt") unten += `<p class="hinweis">🪪 ${T("coaching.err.ausweis")} <a href="#ausweis">${T("ausweis.jetzt")} →</a></p>`;
        else if (!geht) unten += `<p class="hinweis">${T("coaching.err.gratisvoll")}</p>`;
      }
      unten += `<p class="hinweis">${T("coaching.regeln")}</p>`;
    }
  }
  return `<section class="formular">
    <a class="hinweis" href="#coaching">← ${T("coaching.titel")}</a>
    <h1>${esc(thema(s))}</h1>
    <div class="karte liste">
      <div><span>${T("coaching.coach")}</span><b>🎙 ${esc(s.coach)}</b></div>
      <div><span>${T("coaching.format")}</span><b>${s.format}</b></div>
      <div><span>${T("coaching.beginn")}</span><b>${zeit(s.beginn)} <small>(${T("coaching.zeitzone")})</small></b></div>
      <div><span>${T("coaching.dauer")}</span><b>${s.dauer} min</b></div>
      <div><span>${T("coaching.plaetze.titel")}</span><b>${T("coaching.teilnehmer", s.zahlende + s.gratisBelegt, s.max, s.min)}</b></div>
      <div><span>${T("coaching.schluss")}</span><b>${zeit(schluss(s))}</b></div>
      <div><span>${T("coaching.status")}</span><b>${T("coaching.st." + s.status)}</b></div>
    </div>
    ${s.besch ? `<div class="karte">${esc(Array.isArray(s.besch) ? s.besch[SPRACHEN.indexOf(S.sprache)] : s.besch)}</div>` : ""}
    <div class="karte preis-karte"><div class="klein-titel">💶 ${T("coaching.preis.titel")}</div>
      ${s.endpreis ? `<div class="zahl">${euro(s.endpreis)} €</div><p>${T("coaching.endpreis")}</p>`
        : `<div class="zahl">${euro(preisFuer(s, 0))} € ${preisVoll(s) < preisFuer(s, 0) ? `<span>→ ${euro(preisVoll(s))} €</span>` : ""}</div>
           <p>${T("coaching.preis.erkl", euro(gesamt(s)), s.min)}</p>${rabatt ? `<p>★ ${T("coaching.preis.premium", rabatt, euro(preisFuer(s, rabatt)))}</p>` : ""}`}
    </div>
    ${unten}
  </section>`;
};
function buchen(s, preisId) {
  const p = preisId ? S.preise.find(x => x.id === preisId) : null;
  const rabatt = p ? (p.art === "monat" ? 100 : 50) : meinRabatt();
  const betrag = rabatt === 100 ? 0 : preisFuer(s, rabatt);
  S.offen = { art: "coaching", sid: s.id, betrag, rabatt, preisId };
  speichern();
  if (betrag === 0) { bezahlt(); geh("session/" + s.id); } else geh("bezahlen");
}
function bezahlt() {
  const o = S.offen; if (!o) return;
  if (o.art === "premium") {
    const bis = new Date(Math.max(Date.now(), S.premiumBis || 0));
    bis.setMonth(bis.getMonth() + MONATE[o.plan || "monat"]);
    S.premium = true; S.premiumBis = bis.getTime();
  }
  else {
    const s = S.sessions.find(x => x.id === o.sid);
    S.buchungen[s.id] = { betrag: o.betrag, rabatt: o.rabatt, erstattet: 0, status: "bezahlt", preisId: o.preisId };
    if (o.rabatt === 100) s.gratisBelegt++; else s.zahlende++;
    if (o.preisId) S.preise.find(x => x.id === o.preisId).eingeloest = true;
  }
  S.offen = null; speichern(); toast(T("demo.mail"));
}
function stornieren(s) {
  const b = S.buchungen[s.id];
  b.erstattet = b.betrag; b.status = "erstattet";
  if (b.rabatt === 100) s.gratisBelegt--; else s.zahlende--;
  if (b.preisId) S.preise.find(x => x.id === b.preisId).eingeloest = false;
  speichern(); toast(T("coaching.storniert")); zeigen();
}
function vorspulen(s) {
  const b = S.buchungen[s.id];
  s.zahlende = Math.min(s.max - s.gratisBelegt, s.zahlende + Math.floor(Math.random() * 3));
  if (s.zahlende < s.min) {
    s.status = "abgesagt"; b.erstattet = b.betrag; b.status = "erstattet";
    if (b.preisId) S.preise.find(x => x.id === b.preisId).eingeloest = false;
    toast(T("demo.ab", euro(b.betrag)));
  } else {
    s.status = "findet_statt"; s.endpreis = aufrunden(gesamt(s) / s.zahlende);
    const soll = b.rabatt === 100 ? 0 : aufrunden(s.endpreis * (100 - b.rabatt) / 100);
    b.erstattet = Math.max(0, Math.round((b.betrag - soll) * 100) / 100);
    toast(T("demo.statt", euro(s.endpreis), euro(b.erstattet)));
  }
  speichern(); zeigen();
}

    <a class="knopf grau" href="#profil">← ${T("allg.zurueck")}</a></section>`;
};

// ---------------------------------------------------------------------
// Coach-Bereich
// ---------------------------------------------------------------------
const TEILNEHMER = [["AnaPoker", 15], ["Cristi92", 0], ["Elena.S", 15], ["Sorin77", 0], ["Ioana_GTO", 15]];
SEITEN.coach = () => {
  const meine = S.sessions.filter(s => s.coach === S.nick);
  nachher = () => document.querySelectorAll("[data-absagen]").forEach(b => b.onclick = () => {
    if (!confirm(T("coach.absagen.frage"))) return;
    S.sessions.find(s => s.id === +b.dataset.absagen).status = "abgesagt"; speichern(); toast(T("coach.abgesagt")); zeigen();
  });
  return `<h1>🎙 ${T("coach.titel")}</h1>
    <div class="knopfreihe"><a class="knopf gruen" href="#coachneu">＋ ${T("coach.neu")}</a><a class="knopf grau" href="#coaching">${T("coaching.titel")} →</a></div>
    <p class="hinweis">${T("coach.anteil", 15)}</p>
    ${meine.length ? "" : `<p class="karte hinweis mitte">${T("coach.leer")}</p>`}
    ${meine.map(s => {
      const tn = TEILNEHMER.slice(0, s.zahlende).map(([n, r]) => [n, r, preisFuer({ ...s, zahlende: s.zahlende - 1 }, r)]);
      const summe = tn.reduce((a, x) => a + x[2], 0);
      return `<section class="karte">
        <div class="session-kopf"><span class="chip aus">${s.format}</span><b>${T("coaching.st." + s.status)}</b></div>
        <h3><a href="#session/${s.id}">${esc(thema(s))}</a></h3>
        <p class="hinweis">📅 ${zeit(s.beginn)} · ⏱ ${s.dauer} min · 👥 ${T("coaching.teilnehmer", s.zahlende + s.gratisBelegt, s.max, s.min)} · ${T("coaching.schluss")}: ${zeit(schluss(s))}</p>
        <div class="liste"><div><span>${T("coach.gesamt")}</span><b>${euro(gesamt(s))} €</b></div>
          <div><span>${T("coaching.preis.titel")}</span><b>${euro(preisFuer(s, 0))} €</b></div>
          <div><span>${T("coach.einnahmen")}</span><b>${euro(summe)} € <small>(${T("coach.deins")}: ${euro(summe * .85)} €)</small></b></div></div>
        ${tn.length ? `<table class="tabelle"><thead><tr><th>${T("rang.spieler")}</th><th>${T("coaching.status")}</th><th class="rechts">€</th></tr></thead><tbody>
          ${tn.map(([n, r, b]) => `<tr><td>${n} ${r ? `<em>−${r} %</em>` : ""}</td><td>${T("buchung.st.bezahlt")}</td><td class="rechts">${euro(b)}</td></tr>`).join("")}</tbody></table>` : ""}
        ${s.status === "geplant" ? `<div class="knopfreihe"><button class="knopf klein rot" data-absagen="${s.id}">✗ ${T("coach.absagen")}</button></div>` : ""}
      </section>`;
    }).join("")}`;
};
SEITEN.coachneu = () => {
  const morgen = new Date(Date.now() + 2 * TAG); morgen.setHours(19, 0, 0, 0);
  const iso = new Date(morgen.getTime() - morgen.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  nachher = () => {
    const f = $("neu"), v = $("vorschau");
    const w = n => Number(f.elements[n].value) || 0;
    const zeigeVorschau = () => {
      const g = w("preis") * w("dauer") / 60, min = Math.max(1, w("min")), max = Math.max(min, w("max"));
      v.textContent = T("coach.vorschau", euro(g) + " €", min, euro(aufrunden(g / min)) + " €", max, euro(aufrunden(g / max)) + " €");
    };
    f.addEventListener("input", zeigeVorschau); zeigeVorschau();
    f.onsubmit = e => {
      e.preventDefault();
      const thema = f.elements.thema.value.trim(), beginn = new Date(f.elements.beginn.value).getTime();
      if (thema.length < 3) { toast(T("coach.err.thema")); return; }
      if (!beginn || beginn < Date.now() + TAG) { toast(T("coach.err.beginn")); return; }
      if (w("min") < 1 || w("max") > 15 || w("min") > w("max")) { toast(T("coach.err.teilnehmer")); return; }
      const id = Math.max(...S.sessions.map(s => s.id)) + 1;
      S.sessions.push({ id, thema, format: f.elements.format.value, coach: S.nick, beginn, dauer: w("dauer"), preis: w("preis"), min: w("min"), max: w("max"),
                        gratis: w("gratis"), zahlende: Math.min(3, w("max")), gratisBelegt: 0, status: "geplant", besch: f.elements.besch.value.trim() });
      speichern(); toast(T("demo.coach.neu.ok")); geh("coach");
    };
  };
  return `<section class="formular"><a class="hinweis" href="#coach">← ${T("coach.titel")}</a><h1>＋ ${T("coach.neu")}</h1>
    <form id="neu" novalidate>
      <label class="feld">${T("coach.thema")}<input name="thema" placeholder="${T("coach.thema.bsp")}" maxlength="120" /></label>
      <div class="zwei"><label class="feld">${T("coaching.format")}<select name="format">${["MTT", "CASH", "SPIN", "OMAHA", "ALLGEMEIN"].map(x => `<option>${x}</option>`).join("")}</select></label>
        <label class="feld">${T("coaching.beginn")} (${T("coaching.zeitzone")})<input name="beginn" type="datetime-local" value="${iso}" /></label></div>
      <label class="feld">${T("coach.beschreibung")}<textarea name="besch" rows="3" maxlength="2000"></textarea></label>
      <div class="zwei"><label class="feld">${T("coaching.dauer")}<select name="dauer">${[30, 45, 60, 90, 120].map(d => `<option value="${d}" ${d === 60 ? "selected" : ""}>${d} min</option>`).join("")}</select></label>
        <label class="feld">${T("coach.preisstunde")}<input name="preis" type="number" min="5" max="1000" value="100" /></label></div>
      <div class="drei"><label class="feld">${T("coach.min")}<input name="min" type="number" min="1" max="15" value="5" /></label>
        <label class="feld">${T("coach.max")}<input name="max" type="number" min="1" max="15" value="15" /></label>
        <label class="feld">${T("coach.gratis")}<input name="gratis" type="number" min="0" max="2" value="1" /></label></div>
      <label class="feld">${T("coach.discord")}<input name="discord" type="url" placeholder="https://discord.gg/…" /></label>
      <div class="karte vorschau" id="vorschau"></div>
      <p class="hinweis">${T("coach.regeln")}</p>
      <button class="knopf gruen breit">${T("coach.anlegen")}</button>
    </form></section>`;
};

// ---------------------------------------------------------------------
// Admin-Bereich
// ---------------------------------------------------------------------
const MUSTER = (titel, name) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200"><rect width="320" height="200" rx="14" fill="#dfe8f1"/><rect x="0" y="0" width="320" height="38" rx="14" fill="#1f4e79"/>
   <text x="16" y="25" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">${titel}</text>
   <rect x="16" y="54" width="86" height="108" rx="6" fill="#b9c7d6"/><circle cx="59" cy="92" r="20" fill="#8da2b8"/><rect x="31" y="118" width="56" height="34" rx="14" fill="#8da2b8"/>
   <text x="118" y="76" font-family="Arial" font-size="13" fill="#333">${name}</text><rect x="118" y="88" width="150" height="9" rx="4" fill="#b9c7d6"/>
   <rect x="118" y="106" width="120" height="9" rx="4" fill="#b9c7d6"/><rect x="118" y="124" width="160" height="9" rx="4" fill="#b9c7d6"/>
   <text x="118" y="160" font-family="Courier New" font-size="14" fill="#555">RX ••••••</text></svg>`);
const DEMO_BENUTZER = [
  ["Vlad_88", "Vlad Ionescu", "vlad.i@example.com", "+40722111222", "mitglied", true, "bestaetigt"],
  ["AnaPoker", "Ana Marin", "ana.m@example.com", "+40733222333", "mitglied", false, "bestaetigt"],
  ["Andrei_MTT", "Andrei Stan", "andrei.s@example.com", "+40744333444", "coach", true, "bestaetigt"],
  ["Ioana_GTO", "Ioana Dobre", "ioana.d@example.com", "+40755444555", "mitglied", true, "offen"],
  ["Radu_AllIn", "Radu Toma", "radu.t@example.com", "+40766555666", "mitglied", false, "offen"],
  ["Multi_Konto7", "Radu Toma", "r.toma+2@example.com", "+40766555699", "mitglied", false, null],
];
let adminBereich = "ausweise";
SEITEN.admin = () => {
  const ad = S.admin;
  const offeneAusweise = [
    ...(S.ausweis === "offen" ? [{ id: "ich", nick: S.nick, name: S.vorname + " " + S.nachname, ausweisName: S.ausweisName, geb: "12.04.1995", typ: "personalausweis", land: "RO" }] : []),
    { id: "a1", nick: "Ioana_GTO", name: "Ioana Dobre", ausweisName: "Ioana Dobre", geb: "03.11.1993", typ: "reisepass", land: "RO" },
    { id: "a2", nick: "Radu_AllIn", name: "Radu Toma", ausweisName: "Radu Tomescu", geb: "21.07.2009", typ: "personalausweis", land: "MD" },
  ].filter(a => !ad.ausweise[a.id]);
  const benutzer = [[S.nick, S.vorname + " " + S.nachname, S.email, S.telefon, S.rolle, S.premium, S.ausweis], ...DEMO_BENUTZER];
  nachher = () => {
    document.querySelectorAll("[data-bereich]").forEach(a => a.onclick = e => { e.preventDefault(); adminBereich = a.dataset.bereich; zeigen(); });
    document.querySelectorAll("[data-ok]").forEach(b => b.onclick = () => {
      const id = b.dataset.ok, haken = $("v_" + id);
      if (!haken.checked) { toast(T("admin.err.volljaehrig")); return; }
      ad.ausweise[id] = "ok"; if (id === "ich") S.ausweis = "bestaetigt"; speichern(); toast(T("admin.ausweis.ok")); zeigen();
    });
    document.querySelectorAll("[data-nein]").forEach(b => b.onclick = () => {
      const id = b.dataset.nein, grund = $("g_" + id).value.trim();
      if (!grund) { toast(T("admin.err.grund")); return; }
      ad.ausweise[id] = "nein"; if (id === "ich") { S.ausweis = "abgelehnt"; S.grund = grund; } speichern(); toast(T("admin.ausweis.nein")); zeigen();
    });
    document.querySelectorAll("[data-sperren]").forEach(b => b.onclick = () => { ad.gesperrt[b.dataset.sperren] = !ad.gesperrt[b.dataset.sperren]; speichern(); toast(T(ad.gesperrt[b.dataset.sperren] ? "admin.gesperrt" : "admin.entsperrt")); zeigen(); });
    document.querySelectorAll("[data-rolle-von]").forEach(s => s.onchange = () => { ad.rollen[s.dataset.rolleVon] = s.value; speichern(); toast(T("admin.gespeichert")); });
    document.querySelectorAll("[data-preis]").forEach(b => b.onclick = () => { ad.preise[b.dataset.preis] = true; speichern(); toast(T("admin.gespeichert")); zeigen(); });
    const q = $("suche"); if (q) q.oninput = () => document.querySelectorAll(".karte.benutzer").forEach(k => k.hidden = !k.textContent.toLowerCase().includes(q.value.toLowerCase()));
  };
  let inhalt = "";
  if (adminBereich === "ausweise") {
    inhalt = offeneAusweise.length ? offeneAusweise.map(a => `<section class="karte pruefung">
        <img src="${MUSTER(T("demo.admin.bild"), esc(a.ausweisName))}" alt="" />
        <div><div class="liste">
          <div><span>${T("reg.nickname")}</span><b>${esc(a.nick)}</b></div>
          <div><span>${T("admin.konto.name")}</span><b>${esc(a.name)}</b></div>
          <div><span>${T("ausweis.name")}</span><b>${esc(a.ausweisName)}</b></div>
          <div><span>${T("reg.geburt")}</span><b>${a.geb}</b></div>
          <div><span>${T("ausweis.typ")}</span><b>${T("ausweis.typ." + a.typ)} (${a.land})</b></div></div>
          <p class="hinweis">${T("admin.pruefen.text")}</p>
          <label class="haken"><input type="checkbox" id="v_${a.id}" /> ${T("admin.volljaehrig")}</label>
          <button class="knopf gruen" data-ok="${a.id}">✓ ${T("admin.bestaetigen")}</button>
          <div class="zeile-form"><input id="g_${a.id}" placeholder="${T("admin.grund")}" /><button class="knopf grau" data-nein="${a.id}">✗ ${T("admin.ablehnen")}</button></div>
        </div></section>`).join("") : `<p class="hinweis mitte karte">${T("admin.keine.ausweise")}</p>`;
  } else if (adminBereich === "benutzer") {
    inhalt = `<div class="zeile-form karte"><input id="suche" placeholder="${T("admin.suche")}" /></div>` + benutzer.map(([nick, name, mail, tel, rolle, prem, ausw], i) => {
      const gesperrt = ad.gesperrt[nick], r = i === 0 ? S.rolle : ad.rollen[nick] || rolle;
      return `<section class="karte benutzer ${gesperrt ? "gesperrt" : ""}">
        <div class="benutzer-kopf"><b>${esc(nick)}</b><span class="chip aus">${T("rolle." + r)}</span>${prem ? '<span class="chip aus">★ Premium</span>' : ""}
          ${ausw ? `<span class="chip aus">🪪 ${T("ausweis.st." + ausw)}</span>` : ""}${gesperrt ? '<span class="chip aus rot">⛔</span>' : ""}</div>
        <div class="hinweis">${esc(name)} · ${esc(mail)} · ${esc(tel)}</div>
        ${i === 0 ? "" : `<div class="knopfreihe klein"><select data-rolle-von="${nick}" class="knopf klein grau">${["mitglied", "coach", "admin"].map(x => `<option value="${x}" ${x === r ? "selected" : ""}>${T("rolle." + x)}</option>`).join("")}</select>
          <button class="knopf klein ${gesperrt ? "grau" : "rot"}" data-sperren="${nick}">${gesperrt ? T("admin.entsperren") : "⛔ " + T("admin.sperren")}</button></div>`}
      </section>`;
    }).join("");
  } else {
    const p = [["p1", "Cristi92", "free", "09.2026"], ["p2", "Ioana_GTO", "premium", "09.2026"]].filter(x => !ad.preise[x[0]]);
    inhalt = `<p class="hinweis">${T("admin.preise.text")}</p>` + (p.length ? p.map(([id, n, l, m]) => `<section class="karte best-zeile">
      <span><b>${n}</b> – ${T("preis." + l + ".monat")} <small class="hinweis">(${m})</small></span>
      <button class="knopf klein gruen" data-preis="${id}">✓ ${T("admin.eingeloest")}</button></section>`).join("") : `<p class="hinweis mitte karte">${T("admin.keine.preise")}</p>`);
  }
  return `<h1>⚙ ${T("admin.titel")}</h1>
    <p class="hinweis">${T("demo.zahlen")}</p>
    <div class="zahlen">
      <div class="karte"><span>${T("admin.z.benutzer")}</span><b>128</b></div>
      <div class="karte"><span>${T("admin.z.premium")}</span><b>${23 + (S.premium ? 1 : 0)}</b></div>
      <div class="karte"><span>${T("admin.z.ausweise")}</span><b>${offeneAusweise.length}</b></div>
      <div class="karte"><span>${T("admin.z.sessions")}</span><b>${S.sessions.filter(s => s.status === "geplant" || s.status === "findet_statt").length}</b></div>
      <div class="karte"><span>${T("admin.z.umsatz")}</span><b>${euro(1245 + Object.values(S.buchungen).reduce((a, b) => a + b.betrag - b.erstattet, 0))} €</b></div>
    </div>
    <div class="reiter klein">${["ausweise", "benutzer", "preise"].map(b => `<a href="#" data-bereich="${b}" class="${adminBereich === b ? "on" : ""}">${T("admin." + b)}</a>`).join("")}</div>
    ${inhalt}`;
};

if (!S.sessions.some(s => s.id === 50)) {
  const d = new Date(); d.setDate(d.getDate() + 3); d.setHours(19, 0, 0, 0);
  S.sessions.push({ id: 50, thema: ["Preflop pentru începători", "Preflop für Einsteiger", "Preflop for beginners"], format: "ALLGEMEIN", coach: "__ICH__",
                    beginn: d.getTime(), dauer: 60, preis: 90, min: 4, max: 10, gratis: 1, zahlende: 5, gratisBelegt: 0, status: "geplant" });
}
// die Coach-Session gehört immer dem aktuellen Nickname
S.sessions.forEach(s => { if (s.id === 50) s.coach = S.nick; });
zeigen();
</script>
