<style>
/* =====================================================================
   PokerBrain – Handy zuerst, auf großen Bildschirmen breiter
   ===================================================================== */
:root {
  --bg: #12161c; --panel: #1b2129; --panel2: #222a34; --line: #2c3540; --text: #eef2f6; --muted: #95a2b1;
  --gruen: #2fbf5f; --gruen-d: #23994a; --blau: #2c6be0; --gelb: #f5b82e; --rot: #e5484d;
  --radius: 12px; --unten: 64px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
       padding-bottom: calc(var(--unten) + env(safe-area-inset-bottom)); }
a { color: #7fb2ff; }
h1 { font-size: clamp(24px, 6vw, 40px); line-height: 1.15; margin: 0 0 10px; }
h2 { font-size: 20px; margin: 0 0 8px; }
h3 { font-size: 17px; margin: 6px 0 4px; }
.hinweis { color: var(--muted); font-size: 14px; }
.gross { font-size: clamp(16px, 2.6vw, 20px); color: #cfd8e3; }
.mitte { text-align: center; }

/* Kopf */
.kopf { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
        padding-top: calc(10px + env(safe-area-inset-top)); background: rgba(18, 22, 28, .95); border-bottom: 1px solid var(--line);
        backdrop-filter: blur(6px); }
.logo { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-size: 20px; }
.logo img { border-radius: 8px; }
.logo b { color: var(--gruen); }
.nav-oben { display: none; gap: 4px; }
.nav-oben a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; }
.nav-oben a.on, .nav-oben a:hover { color: var(--text); background: var(--panel); }
.nav-oben a.bald, .nav-unten a.bald { opacity: .45; cursor: default; }
.kopf-rechts { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.sprachen { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.sprachen a { padding: 4px 8px; font-size: 13px; color: var(--muted); text-decoration: none; font-weight: 600; }
.sprachen a.on { background: var(--blau); color: #fff; }

/* Untere Leiste (Handy) */
.nav-unten { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: rgba(27, 33, 41, .98);
             border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-unten a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: var(--unten);
               color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; }
.nav-unten a .ico { font-size: 22px; line-height: 1.1; }
.nav-unten a.on { color: var(--gruen); }
.nur-gross { display: none; }

.inhalt { max-width: 1100px; margin: 0 auto; padding: 18px 16px 30px; }
.fuss { max-width: 1100px; margin: 0 auto; padding: 10px 16px 24px; color: var(--muted); font-size: 13px; text-align: center; }

/* Knöpfe */
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; border-radius: 10px; border: 0;
         font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; color: #fff; background: var(--blau); min-height: 46px; }
.knopf:hover { filter: brightness(1.08); }
.knopf:disabled { opacity: .45; cursor: default; filter: none; }
.knopf.gruen { background: var(--gruen); color: #062b14; }
.knopf.grau { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
.knopf.gelb { background: var(--gelb); color: #2b1d00; }
.knopf.klein { padding: 6px 12px; min-height: 34px; font-size: 14px; }
.knopf.breit { width: 100%; margin-top: 8px; }
.knopf.gross-k { font-size: 18px; padding: 14px 24px; }
.knopfreihe { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }

/* Start (Gast) */
.held { padding: 24px 0 10px; }
.pakete { display: grid; gap: 14px; margin-top: 18px; }
.paket { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.paket.premium { border-color: var(--gelb); background: linear-gradient(160deg, #2a2412, var(--panel) 60%); }
.paket h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.paket .preis { font-size: 14px; color: var(--muted); font-weight: 600; }
.paket ul { margin: 0; padding-left: 20px; }
.paket li { margin: 4px 0; }

/* Dashboard */
.begruessung { margin-top: 4px; }
.karte { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
.kontingent { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
              background: radial-gradient(ellipse at top left, #1f6b46 0%, var(--panel) 70%); }
.klein-titel { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.zahl { font-size: 46px; font-weight: 800; line-height: 1.1; }
.zahl span { font-size: 22px; color: var(--muted); }
.balken { height: 8px; width: min(260px, 60vw); background: #0d1117; border-radius: 4px; overflow: hidden; margin: 6px 0; }
.balken i { display: block; height: 100%; background: var(--gruen); }
.kacheln { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 12px; }
.kachel { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
          color: var(--text); text-decoration: none; }
a.kachel:hover { border-color: var(--gruen); }
.kachel .ico { font-size: 26px; }
.kachel p { margin: 0; color: var(--muted); font-size: 14px; }
.kachel em { font-style: normal; font-size: 11px; background: var(--panel2); color: var(--muted); padding: 2px 6px; border-radius: 6px; vertical-align: middle; }
.kachel.bald { opacity: .7; }

/* Formulare */
.formular { max-width: 620px; margin: 0 auto; }
.formular.schmal { max-width: 420px; }
.feld, .haken { display: block; margin: 10px 0; font-weight: 600; font-size: 14px; color: #cfd8e3; }
.feld input { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-size: 16px; color: var(--text);
              background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.feld input:focus { outline: 2px solid var(--blau); border-color: transparent; }
.feld small, .haken small { display: block; color: var(--rot); font-weight: 600; min-height: 0; }
.feld.fehler input { border-color: var(--rot); }
.haken { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; font-weight: 500; }
.haken input { width: 20px; height: 20px; margin-top: 2px; }
.haken small { width: 100%; }
.haken > span { flex: 1; min-width: 0; }
.zwei { display: grid; gap: 0 12px; grid-template-columns: 1fr; }
.meldung { padding: 12px 14px; border-radius: 10px; margin: 10px 0; font-weight: 600; }
.meldung.ok { background: #143d24; border: 1px solid var(--gruen); }
.meldung.fehler { background: #3d1416; border: 1px solid var(--rot); }
.meldung.info { background: #2b2410; border: 1px solid var(--gelb); font-weight: 500; }
.liste > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.liste > div:last-child { border-bottom: 0; }
.liste span { color: var(--muted); }
.liste small { color: var(--muted); font-weight: 400; }

/* ab Tablet / PC */
@media (min-width: 720px) {
  body { padding-bottom: 0; }
  .nav-unten { display: none; }
  .nav-oben { display: flex; }
  .nur-gross { display: inline-flex; }
  .pakete { grid-template-columns: 1fr 1fr; }
  .kacheln { grid-template-columns: 1fr 1fr; }
  .zwei { grid-template-columns: 1fr 1fr; }
  .inhalt { padding-top: 28px; }
}
@media (min-width: 1000px) {
  .kacheln { grid-template-columns: repeat(4, 1fr); }
}

/* ---------------- Quiz-Akademie ---------------- */
.challenge { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
             background: radial-gradient(ellipse at top left, #2c3f7a 0%, var(--panel) 70%); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 999px; padding: 8px 14px;
        font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.chip:hover { border-color: var(--gruen); }
.chip.aus { cursor: default; padding: 4px 10px; font-size: 13px; color: #cfd8e3; }
.quiz { max-width: 720px; margin: 0 auto; }
.quiz-kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.quiz-kopf #fortschritt { color: var(--muted); font-weight: 600; }
.punkte-pille { margin-left: auto; background: #3a2f12; color: #ffd870; border: 1px solid var(--gelb); border-radius: 999px;
                padding: 2px 10px; font-weight: 700; font-size: 14px; }
.punkte-pille:empty { display: none; }
.zeit { height: 6px; background: #0d1117; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
.zeit i { display: block; height: 100%; background: linear-gradient(90deg, var(--gelb), var(--gruen)); transition: width .1s linear; }
.situation { background: radial-gradient(ellipse at center, #23805a 0%, #1d6b45 75%); border: 6px solid #4a3424; border-radius: 22px;
             padding: 14px; color: #fff; }
.infos { display: flex; flex-wrap: wrap; gap: 6px; }
.infos .chip.aus { background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.25); color: #fff; }
.karten-zeile { display: flex; gap: 22px; flex-wrap: wrap; margin: 12px 0 6px; }
.mini-titel { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .8; margin-bottom: 4px; }
.karten { display: flex; gap: 6px; }
.pk { width: 48px; height: 66px; border-radius: 7px; background: #fff; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-weight: 800; font-size: 22px; line-height: 1; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.pk small { font-size: 19px; }
.frage { font-size: 17px; line-height: 1.45; margin: 10px 0 2px; }
.optionen { display: grid; gap: 8px; margin: 12px 0; }
.option { padding: 16px; font: inherit; font-size: 17px; font-weight: 700; color: var(--text); background: var(--panel);
          border: 2px solid var(--line); border-radius: 12px; cursor: pointer; text-align: center; }
.option:hover:not(:disabled) { border-color: var(--blau); }
.option:disabled { cursor: default; opacity: .65; }
.option.korrekt { opacity: 1; border-color: var(--gruen); background: #143d24; }
.option.falsch { opacity: 1; border-color: var(--rot); background: #3d1416; }
.aufloesung { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.ergebnis { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ergebnis.gut { color: #4ade80; } .ergebnis.schlecht { color: #f87171; }
.ergebnis .punkte-pille { margin-left: 0; }
.tipp { background: var(--panel2); border-left: 4px solid var(--gelb); padding: 8px 12px; border-radius: 6px; }

/* ---------------- Rangliste ---------------- */
.reiter { display: flex; gap: 4px; margin: 6px 0; overflow-x: auto; }
.reiter a { flex: 1; text-align: center; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
            color: var(--muted); text-decoration: none; font-weight: 700; white-space: nowrap; }
.reiter.klein a { padding: 6px 10px; font-size: 14px; }
.reiter a.on { background: var(--blau); color: #fff; border-color: var(--blau); }
.reiter a.on.gelb { background: var(--gelb); color: #2b1d00; border-color: var(--gelb); }
.rang-raster { display: grid; gap: 12px; }
.tabelle { width: 100%; border-collapse: collapse; }
.tabelle th { text-align: left; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.tabelle td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
.tabelle .rechts { text-align: right; }
.tabelle tr.ich td { background: #143d24; }
.tabelle em { color: var(--muted); font-style: normal; font-size: 13px; }
.preisliste, .siegerliste { list-style: none; padding: 0; margin: 8px 0 0; }
.preisliste li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.siegerliste li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.siegerliste small { display: block; color: var(--muted); }
@media (min-width: 900px) { .rang-raster { grid-template-columns: 1.6fr 1fr; align-items: start; } }

/* ---------------- Bestätigung ---------------- */
.meldung.test { background: #2b2410; border: 1px dashed var(--gelb); font-weight: 500; word-break: break-all; }
.meldung.test .code { font-size: 22px; letter-spacing: .15em; color: #ffd870; }
.best-zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid var(--line); }
.best-zeile b.gut { color: #4ade80; } .best-zeile b.offen { color: #ffb37a; }
.best-zeile form { margin: 0; }
.code-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.code-form .feld { flex: 1; min-width: 160px; margin-bottom: 0; }
.code-form input { letter-spacing: .3em; font-size: 22px; text-align: center; }
.banner { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #2b2410;
          border: 1px solid var(--gelb); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }

/* ---------------- Formulare: Auswahl, Textfeld, Hinweise ---------------- */
.feld select, .feld textarea { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-size: 16px; color: var(--text);
                               background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.feld textarea { resize: vertical; }
.feld small.info { color: var(--muted); font-weight: 400; }
.drei { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr 1fr; align-items: end; }
.drei .feld { font-size: 13px; }
.gut { color: #4ade80; }
.knopf.rot { background: #3d1416; color: #ffb4b6; border: 1px solid var(--rot); }
.knopf.discord { background: #5865f2; color: #fff; }
.zeile-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.zeile-form input, .zeile-form select { flex: 1; min-width: 140px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--text);
                                        background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.knopfreihe.klein { margin: 8px 0 0; gap: 8px; }
.schutz { padding-left: 18px; margin: 14px 0; }
.schutz li { margin: 4px 0; list-style: none; }
.vorschau { font-weight: 600; color: #cfd8e3; }
.beschreibung { white-space: pre-line; }

/* ---------------- Coaching ---------------- */
.sessions { display: grid; gap: 12px; margin-top: 12px; }
.kachel.session h3 { margin: 6px 0 4px; }
.kachel.session p { margin: 2px 0; }
.session-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.session-kopf .frei { color: #4ade80; } .session-kopf .zu { color: var(--muted); }
.session-preis { margin-top: 8px !important; color: var(--text) !important; font-size: 18px !important; }
.session-preis small { color: var(--muted); font-size: 13px; }
.preis-karte .zahl { font-size: 36px; }
.preis-karte .zahl span { font-size: 18px; }
.karte.dabei { border-color: var(--gruen); background: linear-gradient(160deg, #143d24, var(--panel) 60%); }

/* ---------------- Admin ---------------- */
.zahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.zahlen .karte { margin: 0; padding: 12px; }
.zahlen span { display: block; color: var(--muted); font-size: 13px; }
.zahlen b { font-size: 26px; }
.pruefung { display: grid; gap: 14px; }
.pruefung img { width: 100%; max-height: 360px; object-fit: contain; background: #0d1117; border-radius: 10px; }
.benutzer-kopf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.karte.benutzer.gesperrt { border-color: var(--rot); }
.chip.rot { border-color: var(--rot); color: #ffb4b6; }
@media (min-width: 720px) {
  .sessions { grid-template-columns: 1fr 1fr; }
  .pruefung { grid-template-columns: 360px 1fr; align-items: start; }
}
@media (min-width: 1000px) { .sessions { grid-template-columns: repeat(3, 1fr); } }

/* ---------------- Premium-Laufzeiten ---------------- */
.plaene { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.plan { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; text-align: center;
        background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; }
label.plan { cursor: pointer; }
.plan input { position: absolute; opacity: 0; pointer-events: none; }
label.plan:has(input:checked) { border-color: var(--gelb); box-shadow: 0 0 0 1px var(--gelb) inset; background: #2a2412; }
.plan.bester::before { content: "★"; position: absolute; top: -9px; right: 8px; color: var(--gelb); font-size: 15px; }
.plan-name { color: var(--muted); font-size: 13px; font-weight: 600; }
.plan-preis { font-size: clamp(16px, 4.4vw, 21px); white-space: nowrap; }
.spar { font-size: 12px; font-weight: 700; color: #062b14; background: var(--gruen); border-radius: 999px; padding: 1px 8px; }

/* ---------------- Profil, Foto, beste Gewinne ---------------- */
[id] { scroll-margin-top: 80px; }
.profil-kopf { display: flex; gap: 16px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.profil-kopf h1 { margin: 0 0 4px; word-break: break-all; }
.profil-kopf .chips { margin: 0 0 8px; }
.avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--panel2); border: 1px solid var(--line);
          display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--muted); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.gross { width: 96px; height: 96px; font-size: 40px; border: 2px solid var(--gruen); }
.bild-form { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
.gewinne { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 10px; }
.gewinn { display: flex; flex-direction: column; gap: 8px; margin: 0; background: var(--panel2); border: 1px solid var(--line);
          border-radius: 10px; padding: 10px; }
.gewinn-bild { flex: none; width: 100%; display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 10; border-radius: 8px; overflow: hidden;
               background: #0d1117; border: 1px dashed var(--line); color: var(--muted); text-align: center; cursor: pointer; font-size: 26px; }
.gewinn-bild small { font-size: 13px; }
.gewinn-bild img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gewinn input[name=titel] { padding: 9px 10px; font: inherit; font-size: 15px; color: var(--text); background: #0d1117;
                            border: 1px solid var(--line); border-radius: 8px; width: 100%; }
.gewinn figcaption { font-size: 15px; }
/* öffentliches Profil: Bild in voller Größe (Handy-Screenshots sind hoch) */
figure.gewinn .gewinn-bild { aspect-ratio: auto; border-style: solid; }
figure.gewinn .gewinn-bild img { width: auto; max-width: 100%; height: auto; max-height: 75vh; }
.gewinn .knopfreihe.klein { margin: 0; }
details.aufklapp summary { cursor: pointer; font-weight: 700; list-style: none; }
details.aufklapp summary::-webkit-details-marker { display: none; }
details.aufklapp summary::after { content: "▾"; float: right; color: var(--muted); }
details.aufklapp[open] summary { margin-bottom: 8px; }
details.aufklapp[open] summary::after { content: "▴"; }
.feld input:disabled { opacity: .55; }
a.name-link { color: inherit; text-decoration: none; }
a.name-link:hover { text-decoration: underline; }
.zahlen.klein > div { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.zahlen.klein b { font-size: 24px; }

/* ---------------- Rangliste: Fotos, 0 Punkte, Beste Gewinne ---------------- */
.spieler-zeile { display: inline-flex; align-items: center; gap: 8px; }
.spieler-zeile .avatar { width: 28px; height: 28px; font-size: 13px; }
.tabelle tr.ohne td { color: var(--muted); }
.wand .wand-kopf { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.wand .wand-kopf .avatar { width: 48px; height: 48px; font-size: 20px; border: 2px solid var(--gruen); }
.wand-bilder { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.wand-bild { display: flex; flex-direction: column; gap: 6px; color: var(--text); text-decoration: none; background: var(--panel2);
             border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.wand-bild:hover { border-color: var(--gelb); }
.wand-bild img { width: 100%; height: 220px; object-fit: cover; object-position: top; display: block; background: #0d1117; }
.wand-bild span { padding: 0 8px 8px; font-size: 13px; line-height: 1.35; }

/* ---------------- Chat ---------------- */
.chat-seite { max-width: 820px; margin: 0 auto; }
.chat-raeume { flex-wrap: wrap; overflow: visible; }
.chat-raeume a { white-space: nowrap; flex: 1 1 150px; font-size: 14px; padding: 8px; }
.chat-info { margin: 6px 2px; }
.chat { height: calc(100dvh - 340px); min-height: 280px; overflow-y: auto; padding: 10px; margin: 8px 0; display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; }
.msg-inhalt { min-width: 0; flex: 1; background: var(--panel2); border-radius: 4px 12px 12px 12px; padding: 6px 10px 8px; }
.msg.eigen .msg-inhalt { background: #17324a; }
.msg-kopf { display: flex; gap: 8px; align-items: baseline; font-size: 13px; flex-wrap: wrap; }
.msg-name { font-weight: 700; color: #7fb2ff; text-decoration: none; }
.msg-name.anonym { color: var(--muted); }
.msg-admin { color: #ffb37a; }
.msg-zeit { color: var(--muted); }
.msg-weg { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 2px; }
.msg-weg:hover { color: var(--rot); }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
/* Chat mit Mundi: Bild von Mundi als Hintergrund, abgedunkelt, damit die Nachrichten lesbar bleiben */
.chat.raum-mundi { background: linear-gradient(rgba(18, 22, 28, .45), rgba(18, 22, 28, .82)), url("/img/chat-mundi.jpg") center 22% / cover no-repeat;
                   border-color: var(--gelb); }
.chat.raum-mundi .msg-inhalt { background: rgba(27, 33, 41, .9); }
.chat.raum-mundi .msg.eigen .msg-inhalt { background: rgba(23, 50, 74, .92); }
.chat.raum-mundi #chat-leer { color: #fff; text-shadow: 0 1px 3px #000; font-weight: 600; }
.chat-eingabe { display: flex; gap: 8px; align-items: flex-end; }
.chat-eingabe textarea { flex: 1; resize: none; padding: 12px; font: inherit; font-size: 16px; color: var(--text); background: #0d1117;
                         border: 1px solid var(--line); border-radius: 10px; max-height: 130px; }
.chat-eingabe textarea:focus { outline: 2px solid var(--blau); border-color: transparent; }
.chat-eingabe .knopf { min-width: 52px; font-size: 18px; }
.chat-regeln { font-size: 12px; margin-top: 6px; }

/* ---------------- Rechtstexte ---------------- */
.recht { max-width: 860px; margin: 0 auto; }
.recht .banner { margin: 10px 0; }
.recht-text h1 { font-size: clamp(22px, 5vw, 30px); }
.recht-text h2 { margin-top: 18px; }
.recht-text p, .recht-text li { color: #cfd8e3; }
.recht-text mark { background: #3a2f12; color: #ffd870; border-radius: 4px; padding: 0 3px; }
.recht-tabelle { overflow-x: auto; }
.recht-tabelle td { font-size: 14px; vertical-align: top; }
.fuss .rechtliches a { color: var(--muted); }

@media (max-width: 480px) {
  .chat-raeume { display: grid; grid-template-columns: 1fr 1fr; }
  .chat-raeume a { padding: 8px 6px; font-size: 13px; }
  .plaene { gap: 6px; }
}
@media (min-width: 720px) {
  .gewinne { grid-template-columns: repeat(3, 1fr); }
  .chat { height: calc(100dvh - 300px); }
}

/* =====================================================================
   NEON-DESIGN (11.11.2026): gleiche Farben wie vorher, aber leuchtend,
   schwarzer Hintergrund mit Neon-Streifen, mehr Luft (Stil wie „Celina Fit“)
   ===================================================================== */
:root {
  --bg: #000; --panel: rgba(7, 11, 15, .88); --panel2: #0a1016; --line: rgba(57, 255, 136, .26); --text: #ecfff5; --muted: #8fb0a2;
  --gruen: #39ff88; --gruen-d: #1fd56a; --blau: #2ea8ff; --gelb: #ffd60a; --rot: #ff3860;
  --radius: 16px;
  --glow-gruen: 0 0 10px rgba(57, 255, 136, .65); --glow-blau: 0 0 12px rgba(46, 168, 255, .65);
  --glow-gelb: 0 0 12px rgba(255, 214, 10, .6); --glow-rot: 0 0 12px rgba(255, 56, 96, .6);
}
body { background: #000; }
/* leichte Neon-Streifen im Hintergrund */
body::before { content: ""; position: fixed; inset: -40%; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(-28deg, transparent 0 90px, rgba(57, 255, 136, .07) 90px 92px, transparent 92px 170px, rgba(46, 168, 255, .05) 170px 180px); }
.inhalt, .fuss { position: relative; z-index: 1; }
.inhalt { padding: 28px 18px 44px; }
a { color: var(--blau); }
h1 { letter-spacing: .5px; text-shadow: 0 0 12px rgba(57, 255, 136, .55), 0 0 32px rgba(57, 255, 136, .25); }
h2, h3 { text-shadow: 0 0 8px rgba(57, 255, 136, .35); }
.gross { color: #cfe9de; }

/* Kopf und Leisten */
.kopf { background: rgba(0, 0, 0, .86); border-bottom: 1px solid rgba(57, 255, 136, .55); box-shadow: 0 2px 22px rgba(57, 255, 136, .22); }
.logo b { color: var(--gruen); text-shadow: var(--glow-gruen); }
.logo img { box-shadow: 0 0 12px rgba(57, 255, 136, .45); }
.nav-oben a.on, .nav-oben a:hover { color: var(--gruen); background: rgba(57, 255, 136, .08); box-shadow: inset 0 0 0 1px rgba(57, 255, 136, .55), var(--glow-gruen); text-shadow: var(--glow-gruen); }
.sprachen { border-color: rgba(46, 168, 255, .5); }
.sprachen a.on { background: var(--blau); color: #00121f; box-shadow: var(--glow-blau); }
.nav-unten { background: rgba(0, 0, 0, .94); border-top: 1px solid rgba(57, 255, 136, .5); box-shadow: 0 -2px 20px rgba(57, 255, 136, .18); }
.nav-unten a.on { color: var(--gruen); text-shadow: var(--glow-gruen); }

/* Karten, Kacheln, Pakete – mehr Luft und Leuchtrand */
.karte, .kachel, .paket, .aufloesung, .gewinn, .wand-bild, .zahlen.klein > div {
  border-color: var(--line); box-shadow: 0 0 18px rgba(57, 255, 136, .07), inset 0 0 26px rgba(57, 255, 136, .03); backdrop-filter: blur(4px); }
.karte { padding: 22px; margin: 18px 0; border-radius: 18px; }
.kachel { padding: 22px; border-radius: 18px; transition: box-shadow .2s, transform .2s, border-color .2s; }
.kachel:hover { border-color: var(--gruen); box-shadow: 0 0 22px rgba(57, 255, 136, .3); transform: translateY(-2px); }
.kacheln, .pakete, .sessions, .rang-raster { gap: 18px; }
.paket { padding: 24px; border-radius: 18px; }
.paket.premium { border-color: var(--gelb); background: linear-gradient(160deg, rgba(255, 214, 10, .12), var(--panel) 60%); box-shadow: 0 0 22px rgba(255, 214, 10, .22); }
.karte.dabei { border-color: var(--gruen); background: linear-gradient(160deg, rgba(57, 255, 136, .14), var(--panel) 60%); }

/* Knöpfe: gleiche Farben, leuchtend */
.knopf { border-radius: 12px; color: #00121f; background: var(--blau); box-shadow: var(--glow-blau); letter-spacing: .3px; transition: box-shadow .2s, filter .2s; }
.knopf:hover { filter: brightness(1.1); box-shadow: 0 0 20px rgba(46, 168, 255, .85); }
.knopf.gruen { background: var(--gruen); color: #00140a; box-shadow: var(--glow-gruen); }
.knopf.gruen:hover { box-shadow: 0 0 22px rgba(57, 255, 136, .9); }
.knopf.gelb { background: var(--gelb); color: #1f1700; box-shadow: var(--glow-gelb); }
.knopf.grau { background: transparent; color: var(--gruen); border: 1px solid rgba(57, 255, 136, .6); box-shadow: 0 0 10px rgba(57, 255, 136, .2), inset 0 0 10px rgba(57, 255, 136, .06); }
.knopf.rot { background: rgba(255, 56, 96, .1); color: #ff9db1; border: 1px solid var(--rot); box-shadow: var(--glow-rot); }
.knopfreihe { gap: 12px; margin: 20px 0 10px; }

/* Eingaben */
.feld input, .feld select, .feld textarea, .zeile-form input, .zeile-form select, .gewinn input[name=titel] {
  background: #04070a; border: 1px solid rgba(57, 255, 136, .3); border-radius: 12px; color: var(--text); }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: none; border-color: var(--gruen); box-shadow: var(--glow-gruen); }

/* Meldungen, Chips, Reiter */
.meldung.ok { background: rgba(57, 255, 136, .08); border-color: var(--gruen); box-shadow: 0 0 14px rgba(57, 255, 136, .25); }
.meldung.fehler { background: rgba(255, 56, 96, .08); border-color: var(--rot); box-shadow: 0 0 14px rgba(255, 56, 96, .25); }
.meldung.info, .meldung.test, .banner { background: rgba(255, 214, 10, .07); border-color: var(--gelb); box-shadow: 0 0 14px rgba(255, 214, 10, .2); }
.chip { background: transparent; border-color: rgba(46, 168, 255, .5); color: #bfe3ff; }
.chip:hover, .chip.on { border-color: var(--blau); box-shadow: var(--glow-blau); color: #fff; }
.reiter a { border-radius: 12px; }
.reiter a.on { background: var(--blau); color: #00121f; border-color: var(--blau); box-shadow: var(--glow-blau); }
.reiter a.on.gelb { background: var(--gelb); color: #1f1700; border-color: var(--gelb); box-shadow: var(--glow-gelb); }
.punkte-pille { background: rgba(255, 214, 10, .1); color: var(--gelb); border-color: var(--gelb); box-shadow: var(--glow-gelb); }
.spar { color: #00140a; box-shadow: var(--glow-gruen); }

/* Quiz */
.situation { box-shadow: 0 0 26px rgba(57, 255, 136, .28); }
.option { border-radius: 14px; border: 1px solid rgba(57, 255, 136, .28); transition: border-color .2s, box-shadow .2s; }
.option:hover:not(:disabled) { border-color: var(--gruen); box-shadow: var(--glow-gruen); }
.option.korrekt { background: rgba(57, 255, 136, .12); box-shadow: 0 0 16px rgba(57, 255, 136, .5); }
.option.falsch { background: rgba(255, 56, 96, .12); box-shadow: 0 0 16px rgba(255, 56, 96, .5); }
.tipp { background: rgba(255, 214, 10, .06); }
.balken, .zeit { background: #05080b; box-shadow: inset 0 0 0 1px rgba(57, 255, 136, .2); }
.balken i { box-shadow: var(--glow-gruen); }
.zeit i { box-shadow: 0 0 10px rgba(255, 214, 10, .6); }

/* Rangliste, Chat */
.tabelle tr.ich td { background: rgba(57, 255, 136, .12); }
.msg.eigen .msg-inhalt { background: rgba(46, 168, 255, .16); box-shadow: inset 0 0 0 1px rgba(46, 168, 255, .35); }
.avatar { box-shadow: 0 0 10px rgba(57, 255, 136, .35); }


/* =================== nur für die Demo =================== */
.demo-leiste { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 12px; padding: 6px 12px;
               background: #2b2410; border-bottom: 1px dashed var(--gelb); font-size: 13px; color: #ffe2a0; }
.demo-leiste b { background: var(--gelb); color: #2b1d00; padding: 1px 8px; border-radius: 6px; letter-spacing: .08em; }
.demo-leiste .rollen { display: inline-flex; gap: 4px; align-items: center; }
.demo-leiste button { font: inherit; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 7px; cursor: pointer;
                      border: 1px solid #6b5520; background: transparent; color: #ffe2a0; }
.demo-leiste button.on { background: var(--gelb); color: #2b1d00; border-color: var(--gelb); }
@media (max-width: 719px) { .demo-leiste { gap: 6px; padding: 5px 8px; } .demo-leiste .satz { display: none; } }
.kopf { top: 0; }
#toast { position: fixed; left: 50%; bottom: calc(var(--unten) + 16px); transform: translateX(-50%) translateY(20px); opacity: 0;
         background: #2b2410; color: #ffe2a0; border: 1px solid var(--gelb); padding: 10px 16px; border-radius: 10px; z-index: 50;
         max-width: min(92vw, 520px); font-size: 14px; font-weight: 600; transition: .25s; pointer-events: none; text-align: center; }
#toast.zeigen { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 720px) { #toast { bottom: 24px; } }
.feld select, .feld textarea { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-size: 16px; color: var(--text);
                               background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.feld input[type=file] { padding: 9px; }
.drei { display: grid; gap: 0 12px; grid-template-columns: 1fr 1fr 1fr; align-items: end; }
.drei .feld { font-size: 13px; }
.knopf.rot { background: #3d1416; color: #ffb4b6; border: 1px solid var(--rot); }
.knopf.discord { background: #5865f2; color: #fff; }
.zeile-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.zeile-form input, .zeile-form select { flex: 1; min-width: 130px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--text);
                                        background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
.gut { color: #4ade80; }
.schutz { padding-left: 0; margin: 14px 0; } .schutz li { margin: 4px 0; list-style: none; }

/* Poker-Tisch */
.tisch-oval { position: relative; width: 100%; max-width: 560px; aspect-ratio: 16 / 10; margin: 6px auto 14px; }
.tisch-oval .filz { position: absolute; inset: 13% 9%; border-radius: 50%; background: radial-gradient(ellipse at center, #23805a 0%, #1d6b45 75%);
                    border: 8px solid #4a3424; box-shadow: inset 0 0 30px rgba(0,0,0,.35); display: flex; flex-direction: column;
                    align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.tisch-oval .filz small { opacity: .75; font-weight: 600; }
.sitz { position: absolute; transform: translate(-50%, -50%); min-width: 62px; text-align: center; background: var(--panel2);
        border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 12px; font-weight: 800; z-index: 1; }
.sitz small { display: block; font-weight: 600; color: var(--muted); font-size: 11px; }
.sitz.ich { border-color: var(--gruen); background: #143d24; }
.sitz.fold { opacity: .45; }
.dealer { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; color: #111; font-size: 12px; font-weight: 800;
          display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); z-index: 2; box-shadow: 0 1px 4px #000a; }
.matrix { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; margin-top: 8px; }
.matrix button { aspect-ratio: 1; font: inherit; font-size: clamp(8px, 2.3vw, 12px); padding: 0; border: 0; border-radius: 3px;
                 background: #2a323d; color: #8f9bab; font-weight: 700; cursor: pointer; }
.matrix button.r { background: var(--gruen); color: #062b14; }
.matrix button.akt { outline: 2px solid var(--gelb); outline-offset: 1px; position: relative; z-index: 1; }
.chips .chip.on { background: var(--blau); border-color: var(--blau); color: #fff; }
.entscheidung { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; }
.sperre-karte { text-align: center; }
.sperre-karte .ico { font-size: 40px; }

/* Coaching, Admin */
.sessions { display: grid; gap: 12px; margin-top: 12px; }
.kachel.session h3 { margin: 6px 0 4px; } .kachel.session p { margin: 2px 0; }
.session-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.session-kopf .frei { color: #4ade80; } .session-kopf .zu { color: var(--muted); }
.session-preis { margin-top: 8px !important; color: var(--text) !important; font-size: 18px !important; }
.session-preis small { color: var(--muted); font-size: 13px; }
.preis-karte .zahl { font-size: 36px; } .preis-karte .zahl span { font-size: 18px; }
.karte.dabei { border-color: var(--gruen); background: linear-gradient(160deg, #143d24, var(--panel) 60%); }
.zahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.zahlen .karte { margin: 0; padding: 12px; } .zahlen span { display: block; color: var(--muted); font-size: 13px; } .zahlen b { font-size: 26px; }
.pruefung { display: grid; gap: 14px; }
.pruefung img { width: 100%; max-height: 300px; object-fit: contain; background: #0d1117; border-radius: 10px; }
.benutzer-kopf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.karte.benutzer.gesperrt { border-color: var(--rot); }
.chip.rot { border-color: var(--rot); color: #ffb4b6; }
.knopfreihe.klein { margin: 8px 0 0; gap: 8px; }
.vorschau { font-weight: 600; color: #cfd8e3; }
@media (min-width: 720px) {
  .sessions { grid-template-columns: 1fr 1fr; }
  .pruefung { grid-template-columns: 300px 1fr; align-items: start; }
}
@media (min-width: 1000px) { .sessions { grid-template-columns: repeat(3, 1fr); } }
</style>

const SITUATIONEN = [{"id":"P0033","k":"RFI","f":"MTT","p":"UTG","s":"20bb","h":"8d8h","b":"","ok":1,"o":{"de":["Fold","Raise","Limp"],"en":["Fold","Raise","Limp"],"ro":["Fold","Raise","Limp"]},"t":{"de":["Turnier, 20bb effektiv, alle vor dir haben gefoldet. Du bist UTG.","88 gehört zur Open-Range von UTG bei 20bb. Von hier eröffnest du rund 14% aller Hände, und diese ist dabei.","UTG bei 20bb: öffne etwa 14% der Hände."],"en":["Tournament, 20bb effective, everyone folded to you. You are in the UTG.","88 is inside the UTG opening range at 20bb. From here you open about 14% of hands, and this one is in.","UTG at 20bb: open about 14% of hands."],"ro":["Turneu, 20bb efectiv, toți dinaintea ta au dat fold. Ești pe UTG.","88 face parte din range-ul de deschidere de pe UTG la 20bb. De aici deschizi cam 14% din mâini, iar aceasta e inclusă.","UTG la 20bb: deschide cam 14% din mâini."]},"ch":true},{"id":"P0153","k":"VSOPEN","f":"MTT","p":"UTG+1","s":"20bb","h":"9s9h","b":"","ok":1,"o":{"de":["Fold","Call","3-Bet"],"en":["Fold","Call","3-Bet"],"ro":["Fold","Call","3-Bet"]},"t":{"de":["Turnier, 20bb effektiv. UTG eröffnet mit 2,3bb, alle anderen folden. Du bist UTG+1.","99 spielt sich gegen ein UTG-Open am besten als Call: stark genug zum Weiterspielen, aber ein 3-Bet würde meist nur bessere Hände weiterspielen lassen.","Gegen ein Open: Call, 3-Bet oder Fold, nie limpen hinterher."],"en":["Tournament, 20bb effective. UTG opens to 2.3bb, everyone else folds. You are in the UTG+1.","99 plays best as a call against a UTG open: strong enough to continue, but a 3-bet mostly only keeps better hands in.","Facing an open: call, 3-bet or fold, never limp behind."],"ro":["Turneu, 20bb efectiv. UTG deschide 2,3bb, restul dau fold. Ești pe UTG+1.","99 se joacă cel mai bine ca un call împotriva unui open de pe UTG: destul de tare ca să continui, dar un 3-bet ar ține în mână mai ales mâini mai bune.","Contra unui open: call, 3-bet sau fold, niciodată limp în spate."]},"ch":true},{"id":"P0001","k":"PUSH","f":"MTT","p":"UTG","s":"10bb","h":"AcJd","b":"","ok":1,"o":{"de":["Fold","All-in","Raise 2,2bb"],"en":["Fold","All-in","Raise 2.2bb"],"ro":["Fold","All-in","Raise 2,2bb"]},"t":{"de":["Turnier, du hast nur noch 10bb, alle vor dir haben gefoldet. Du bist UTG.","Mit 10bb gibt es kein Raise/Fold mehr, nur All-in oder Fold. AJo ist in der Push-Range von UTG (etwa 14% aller Hände).","Unter 15bb: Push oder Fold, nie klein raisen."],"en":["Tournament, you are down to 10bb, everyone folded to you. You are in the UTG.","At 10bb there is no raise/fold any more, only shove or fold. AJo is inside the UTG push range (about 14% of hands).","Under 15bb: push or fold, never min-raise."],"ro":["Turneu, mai ai doar 10bb, toți dinaintea ta au dat fold. Ești pe UTG.","La 10bb nu mai există raise/fold, doar all-in sau fold. AJo e în range-ul de push de pe UTG (cam 14% din mâini).","Sub 15bb: push sau fold, niciodată raise mic."]},"ch":true},{"id":"Q0001","k":"POST","f":"MTT/CASH","p":"BTN","s":"100bb","h":"AsKd","b":"Kh7c2d","ok":1,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Du hast vom Button eröffnet, der BB callt. Flop Kh 7c 2d, der BB checkt.","Top Pair Top Kicker auf einem trockenen Board: Du bist weit vorne, der Gegner hat selten etwas. Eine kleine C-Bet (1/3 Pot) bekommt Calls von schwächeren Händen und kostet wenig, wenn er nichts hat. Groß betten faltet alles, was du schlagen willst.","Trockenes Board, starke Range: klein und oft betten."],"en":["You opened from the button, the BB calls. Flop Kh 7c 2d, the BB checks.","Top pair top kicker on a dry board: you are far ahead and the opponent rarely has much. A small c-bet (1/3 pot) gets calls from weaker hands and costs little when he has nothing. Betting big folds out everything you want to beat.","Dry board, strong range: bet small and often."],"ro":["Ai deschis de pe button, BB dă call. Flop Kh 7c 2d, BB dă check.","Top pair top kicker pe un board uscat: ești mult în față, adversarul rar are ceva. Un c-bet mic (1/3 pot) primește call de la mâini mai slabe și costă puțin când el nu are nimic. Un bet mare face fold tot ce vrei să bați.","Board uscat, range tare: bet mic și des."]},"ch":true},{"id":"P0357","k":"REJAM","f":"MTT","p":"MP","s":"20bb","h":"AsQd","b":"","ok":2,"o":{"de":["Fold","Call","All-in"],"en":["Fold","Call","All-in"],"ro":["Fold","Call","All-in"]},"t":{"de":["Turnier, du hast 20bb. UTG eröffnet mit 2,2bb, alle anderen folden. Du bist MP.","Mit 20bb ist ein Rejam (3-Bet All-in) mit AQo gegen UTG profitabel: Fold-Equity plus genug Equity, wenn du gecallt wirst. Ein Call lässt dich mit kurzem Stack ohne Plan weiterspielen.","15 bis 25bb gegen ein Open: Rejam oder Fold, selten Call."],"en":["Tournament, you have 20bb. UTG opens to 2.2bb, everyone else folds. You are in the MP.","At 20bb a rejam (3-bet all-in) with AQo against UTG is profitable: fold equity plus enough equity when called. Calling leaves you short-stacked without a plan.","15 to 25bb facing an open: rejam or fold, rarely call."],"ro":["Turneu, ai 20bb. UTG deschide 2,2bb, restul dau fold. Ești pe MP.","La 20bb un rejam (3-bet all-in) cu AQo contra UTG e profitabil: fold equity plus destulă equity când ești plătit. Un call te lasă cu stack scurt și fără plan.","15 până la 25bb contra unui open: rejam sau fold, rar call."]},"ch":true},{"id":"P0423","k":"SQUEEZE","f":"MTT","p":"MP","s":"40bb","h":"AdAs","b":"","ok":2,"o":{"de":["Fold","Call","Squeeze (3-Bet)"],"en":["Fold","Call","Squeeze (3-bet)"],"ro":["Fold","Call","Squeeze (3-bet)"]},"t":{"de":["Turnier, 40bb effektiv. Ein Spieler eröffnet, ein zweiter callt. Du bist MP.","Open plus Caller ist ein Squeeze-Spot. AA ist stark genug oder hat die richtigen Blocker, um zu squeezen. Der Pot ist schon groß, und zwei Gegner müssen beide weiterspielen.","Open plus Caller: groß squeezen (etwa 4x) oder folden, Call nur mit spielbaren Händen."],"en":["Tournament, 40bb effective. One player opens, a second one calls. You are in the MP.","Open plus caller is a squeeze spot. AA is strong enough or has the right blockers to squeeze. The pot is already big and two opponents both have to continue.","Open plus caller: squeeze big (about 4x) or fold, call only with playable hands."],"ro":["Turneu, 40bb efectiv. Un jucător deschide, al doilea dă call. Ești pe MP.","Open plus caller e un spot de squeeze. AA e destul de tare sau are blockerele potrivite pentru squeeze. Potul e deja mare și doi adversari trebuie amândoi să continue.","Open plus caller: squeeze mare (cam 4x) sau fold, call doar cu mâini jucabile."]},"ch":true},{"id":"Q0017","k":"POST","f":"MTT/CASH","p":"BTN","s":"100bb","h":"AhKh","b":"Kc8d3s Qh","ok":2,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Du eröffnest vom Button, der BB callt. Flop Kc 8d 3s, du bettest 1/3 Pot, er callt. Turn Qh, er checkt.","Top Pair Top Kicker, und die Dame bringt neue Hände in seine Call-Range (KQ, QJ, JT-Draws), die dich jetzt bezahlen oder ziehen wollen. Der Pot ist schon aufgebaut, jetzt willst du Value und Draws bestrafen: groß betten.","Turn mit starker Hand und Draws: groß betten, nicht klein tröpfeln."],"en":["You open from the button, the BB calls. Flop Kc 8d 3s, you bet 1/3 pot, he calls. Turn Qh, he checks.","Top pair top kicker, and the queen adds new hands to his calling range (KQ, QJ, JT draws) that now pay you or want to draw. The pot is already built, now you want value and to punish draws: bet big.","Turn with a strong hand and draws around: bet big, do not trickle."],"ro":["Deschizi de pe button, BB dă call. Flop Kc 8d 3s, dai bet 1/3 pot, el dă call. Turn Qh, el dă check.","Top pair top kicker, iar dama aduce mâini noi în range-ul lui de call (KQ, QJ, draw-uri JT) care acum te plătesc sau vor să tragă. Potul e deja construit, acum vrei value și să pedepsești draw-urile: bet mare.","Turn cu mână tare și draw-uri în jur: bet mare, nu picura."]},"ch":true},{"id":"P0463","k":"MULTI","f":"MTT","p":"MP","s":"40bb","h":"9d9s","b":"","ok":1,"o":{"de":["Fold","Call","3-Bet"],"en":["Fold","Call","3-Bet"],"ro":["Fold","Call","3-Bet"]},"t":{"de":["Turnier, 40bb effektiv. UTG eröffnet mit 2,3bb, alle anderen folden. Du bist MP. Ein weiterer Spieler hat den Open bereits gecallt.","99 spielt sich gegen ein UTG-Open am besten als Call: stark genug zum Weiterspielen, aber ein 3-Bet würde meist nur bessere Hände weiterspielen lassen.","Gegen ein Open: Call, 3-Bet oder Fold, nie limpen hinterher."],"en":["Tournament, 40bb effective. UTG opens to 2.3bb, everyone else folds. You are in the MP. Another player has already called the open.","99 plays best as a call against a UTG open: strong enough to continue, but a 3-bet mostly only keeps better hands in.","Facing an open: call, 3-bet or fold, never limp behind."],"ro":["Turneu, 40bb efectiv. UTG deschide 2,3bb, restul dau fold. Ești pe MP. Un alt jucător a dat deja call la open.","99 se joacă cel mai bine ca un call împotriva unui open de pe UTG: destul de tare ca să continui, dar un 3-bet ar ține în mână mai ales mâini mai bune.","Contra unui open: call, 3-bet sau fold, niciodată limp în spate."]},"ch":true},{"id":"Q0040","k":"POST","f":"SPIN","p":"BTN","s":"15bb","h":"Kd8d","b":"Kh 5c 2s","ok":1,"o":{"de":["Check","Bet 1/3 Pot","All-in"],"en":["Check","Bet 1/3 Pot","All-in"],"ro":["Check","Bet 1/3 Pot","All-in"]},"t":{"de":["Spin & Go, 3-handed, 15bb. Du eröffnest vom Button auf 2bb, der BB callt. Flop Kh 5c 2s, er checkt. Im Pot liegen 4,5bb.","Top Pair auf trockenem Board mit kurzen Stacks. Er callt mit fast allem im BB, also hat er meist nichts oder ein kleines Paar. Eine kleine Bet holt Value von 5x, 2x, Ass-hoch und lässt ihn am Turn weiter zahlen. All-in foldet alles, was du schlagen willst.","Kurze Stacks, Top Pair: klein betten, Value über zwei Straßen holen."],"en":["Spin & Go, 3-handed, 15bb. You open from the button to 2bb, the BB calls. Flop Kh 5c 2s, he checks. The pot is 4.5bb.","Top pair on a dry board with short stacks. He calls almost anything in the BB, so he mostly has nothing or a small pair. A small bet gets value from 5x, 2x, ace-high and lets him keep paying on the turn. All-in folds everything you want to beat.","Short stacks, top pair: bet small, take value over two streets."],"ro":["Spin & Go, 3-handed, 15bb. Deschizi de pe button 2bb, BB dă call. Flop Kh 5c 2s, el dă check. Potul are 4,5bb.","Top pair pe board uscat cu stack-uri scurte. El dă call cu aproape orice pe BB, deci de obicei n-are nimic sau o pereche mică. Un bet mic ia value de la 5x, 2x, ace-high și îl lasă să plătească și pe turn. All-in face fold tot ce vrei să bați.","Stack-uri scurte, top pair: bet mic, ia value pe două străzi."]},"ch":true},{"id":"Q0023","k":"POST","f":"MTT/CASH","p":"BTN","s":"100bb","h":"AcJc","b":"Jd8s3h 5c 2d","ok":1,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Du eröffnest vom Button, der BB callt. Flop Jd 8s 3h, Bet 1/3, Call. Turn 5c, Check, Check. River 2d, er checkt.","Top Pair mit Ass-Kicker auf einem River, der nichts verändert hat. Er hat zweimal gecheckt, seine Range ist schwach: Jx mit schlechterem Kicker, 8x, Paare. Eine kleine bis mittlere Value-Bet wird von diesen Händen gecallt. Groß betten vertreibt sie.","Dünne Value am River: klein betten, damit schwächere Hände callen."],"en":["You open from the button, the BB calls. Flop Jd 8s 3h, bet 1/3, call. Turn 5c, check, check. River 2d, he checks.","Top pair with an ace kicker on a river that changed nothing. He checked twice, his range is weak: Jx with a worse kicker, 8x, pairs. A small to medium value bet gets called by those hands. Betting big chases them away.","Thin value on the river: bet small so weaker hands call."],"ro":["Deschizi de pe button, BB dă call. Flop Jd 8s 3h, bet 1/3, call. Turn 5c, check, check. River 2d, el dă check.","Top pair cu kicker as pe un river care n-a schimbat nimic. El a dat check de două ori, range-ul lui e slab: Jx cu kicker mai prost, 8x, perechi. Un value bet mic spre mediu primește call de la aceste mâini. Un bet mare le alungă.","Value subțire pe river: bet mic, ca mâinile mai slabe să dea call."]},"ch":true},{"id":"P0464","k":"MULTI","f":"MTT","p":"HJ","s":"40bb","h":"Ah9h","b":"","ok":1,"o":{"de":["Fold","Call","3-Bet"],"en":["Fold","Call","3-Bet"],"ro":["Fold","Call","3-Bet"]},"t":{"de":["Turnier, 40bb effektiv. UTG eröffnet mit 2,3bb, alle anderen folden. Du bist HJ. Ein weiterer Spieler hat den Open bereits gecallt.","A9s spielt sich gegen ein UTG-Open am besten als Call: stark genug zum Weiterspielen, aber ein 3-Bet würde meist nur bessere Hände weiterspielen lassen.","Gegen ein Open: Call, 3-Bet oder Fold, nie limpen hinterher."],"en":["Tournament, 40bb effective. UTG opens to 2.3bb, everyone else folds. You are in the HJ. Another player has already called the open.","A9s plays best as a call against a UTG open: strong enough to continue, but a 3-bet mostly only keeps better hands in.","Facing an open: call, 3-bet or fold, never limp behind."],"ro":["Turneu, 40bb efectiv. UTG deschide 2,3bb, restul dau fold. Ești pe HJ. Un alt jucător a dat deja call la open.","A9s se joacă cel mai bine ca un call împotriva unui open de pe UTG: destul de tare ca să continui, dar un 3-bet ar ține în mână mai ales mâini mai bune.","Contra unui open: call, 3-bet sau fold, niciodată limp în spate."]},"ch":false},{"id":"P0468","k":"MULTI","f":"MTT","p":"BTN","s":"40bb","h":"7d6d","b":"","ok":1,"o":{"de":["Fold","Call","3-Bet"],"en":["Fold","Call","3-Bet"],"ro":["Fold","Call","3-Bet"]},"t":{"de":["Turnier, 40bb effektiv. UTG eröffnet mit 2,3bb, alle anderen folden. Du bist BTN. Ein weiterer Spieler hat den Open bereits gecallt.","76s spielt sich gegen ein UTG-Open am besten als Call: stark genug zum Weiterspielen, aber sich gegen ein CO-Open am besten als Call: stark genug zum Weiterspielen, aber ein 3-Bet würde meist nur bessere Hände weiterspielen lassen.","Gegen ein Open: Call, 3-Bet oder Fold, nie limpen hinterher."],"en":["Tournament, 100bb effective. CO opens to 2.3bb, everyone else folds. You are in the SB. Another player has already called the open.","A7s plays best as a call against a CO open: strong enough to continue, but a 3-bet mostly only keeps better hands in.","Facing an open: call, 3-bet or fold, never limp behind."],"ro":["Turneu, 100bb efectiv. CO deschide 2,3bb, restul dau fold. Ești pe SB. Un alt jucător a dat deja call la open.","A7s se joacă cel mai bine ca un call împotriva unui open de pe CO: destul de tare ca să continui, dar un 3-bet ar ține în mână mai ales mâini mai bune.","Contra unui open: call, 3-bet sau fold, niciodată limp în spate."]},"ch":false},{"id":"P0492","k":"MULTI","f":"MTT/CASH","p":"BB","s":"100bb","h":"Qs3s","b":"","ok":1,"o":{"de":["Fold","Call","3-Bet"],"en":["Fold","Call","3-Bet"],"ro":["Fold","Call","3-Bet"]},"t":{"de":["Turnier, 100bb effektiv. MP eröffnet mit 2,3bb, alle anderen folden. Du bist BB. Ein weiterer Spieler hat den Open bereits gecallt.","Q3s spielt sich gegen ein MP-Open am besten als Call: stark genug zum Weiterspielen, aber ein 3-Bet würde meist nur bessere Hände weiterspielen lassen.","Gegen ein Open: Call, 3-Bet oder Fold, nie limpen hinterher."],"en":["Tournament, 100bb effective. MP opens to 2.3bb, everyone else folds. You are in the BB. Another player has already called the open.","Q3s plays best as a call against a MP open: strong enough to continue, but a 3-bet mostly only keeps better hands in.","Facing an open: call, 3-bet or fold, never limp behind."],"ro":["Turneu, 100bb efectiv. MP deschide 2,3bb, restul dau fold. Ești pe BB. Un alt jucător a dat deja call la open.","Q3s se joacă cel mai bine ca un call împotriva unui open de pe MP: destul de tare ca să continui, dar un 3-bet ar ține în mână mai ales mâini mai bune.","Contra unui open: call, 3-bet sau fold, niciodată limp în spate."]},"ch":false},{"id":"Q0002","k":"POST","f":"MTT/CASH","p":"CO","s":"100bb","h":"AhQh","b":"Ts9s8c","ok":0,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Du eröffnest vom Cutoff, der BB callt. Flop Ts 9s 8c, der BB checkt.","Dieses Board trifft die Call-Range des BB (Connectors, mittlere Karten) viel besser als deine Open-Range. Mit AQ ohne Paar und ohne Flush-Draw hast du wenig Equity und keine Fold-Equity gegen diese Range. Check und den Turn gratis sehen.","Nasses, tiefes Board trifft den Caller: nicht automatisch c-betten."],"en":["You open from the cutoff, the BB calls. Flop Ts 9s 8c, the BB checks.","This board hits the BB's calling range (connectors, middle cards) much better than your opening range. With AQ, no pair and no flush draw you have little equity and no fold equity against that range. Check and see the turn for free.","Wet, low-middle board hits the caller: do not auto c-bet."],"ro":["Deschizi de pe cutoff, BB dă call. Flop Ts 9s 8c, BB dă check.","Acest board lovește range-ul de call al BB-ului (connectori, cărți medii) mult mai bine decât range-ul tău de open. Cu AQ fără pereche și fără flush draw ai puțină equity și nici fold equity contra acestui range. Check și vezi turnul gratis.","Board ud, cu cărți medii, lovește caller-ul: nu da c-bet automat."]},"ch":false},{"id":"Q0007","k":"POST","f":"MTT","p":"SB","s":"30bb","h":"AdJd","b":"7s7h2c","ok":1,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Turnier, 30bb. Du eröffnest aus dem SB, der BB callt. Flop 7s 7h 2c, du bist zuerst dran.","Gepaartes, trockenes Board: Niemand hat oft eine 7. Deine Ass-hoch-Hand ist sogar oft die beste, und eine kleine Bet lässt alle Hände wie T9, J8, Q4 folden, die dich sonst mit zwei Overcards outdrawen könnten. Klein betten ist billig und effektiv.","Gepaartes Board trifft niemanden: klein betten, viele Folds kassieren."],"en":["Tournament, 30bb. You open from the SB, the BB calls. Flop 7s 7h 2c, you act first.","Paired, dry board: nobody has a seven very often. Your ace-high is frequently the best hand, and a small bet folds out hands like T9, J8, Q4 that could otherwise outdraw you. Betting small is cheap and effective.","Paired board hits nobody: bet small, collect lots of folds."],"ro":["Turneu, 30bb. Deschizi din SB, BB dă call. Flop 7s 7h 2c, tu acționezi primul.","Board perechiat, uscat: nimeni nu are des un 7. Mâna ta ace-high e adesea cea mai bună, iar un bet mic face fold mâini ca T9, J8, Q4 care altfel te-ar putea bate cu două overcards. Bet mic e ieftin și eficient.","Board perechiat nu lovește pe nimeni: bet mic, ia multe fold-uri."]},"ch":false},{"id":"Q0012","k":"POST","f":"MTT","p":"BB","s":"35bb","h":"QdJd","b":"Kd9d4h","ok":2,"o":{"de":["Fold","Call","All-in"],"en":["Fold","Call","All-in"],"ro":["Fold","Call","All-in"]},"t":{"de":["Turnier, 35bb. Der CO eröffnet auf 2,3bb, du callst im BB. Flop Kd 9d 4h. Du checkst, er bettet 2/3 Pot (etwa 3,5bb).","Flush-Draw plus Gutshot (jede 10) ergibt 12 Outs, rund 45% Equity. Mit 35bb bringt ein Check-Raise All-in zwei Wege zu gewinnen: Er foldet viele Hände wie AQ, JJ, TT, und wenn er mit Kx callt, bist du fast ein Coinflip. Call ist zu passiv, Fold viel zu eng.","Großer Draw mit 25 bis 40bb: Semi-Bluff All-in, Fold-Equity plus Outs."],"en":["Tournament, 35bb. The CO opens to 2.3bb, you call in the BB. Flop Kd 9d 4h. You check, he bets 2/3 pot (about 3.5bb).","Flush draw plus gutshot (any ten) gives 12 outs, about 45% equity. At 35bb a check-raise all-in gives two ways to win: he folds many hands like AQ, JJ, TT, and if he calls with Kx you are almost a coin flip. Calling is too passive, folding far too tight.","Big draw with 25 to 40bb: semi-bluff all-in, fold equity plus outs."],"ro":["Turneu, 35bb. CO deschide 2,3bb, tu dai call pe BB. Flop Kd 9d 4h. Dai check, el dă bet 2/3 pot (cam 3,5bb).","Flush draw plus gutshot (orice T) înseamnă 12 outs, cam 45% equity. Cu 35bb un check-raise all-in îți dă două căi de a câștiga: el dă fold cu multe mâini ca AQ, JJ, TT, iar dacă dă call cu Kx ești aproape coin flip. Call e prea pasiv, fold mult prea strâns.","Draw mare cu 25 până la 40bb: semi-bluff all-in, fold equity plus outs."]},"ch":false},{"id":"Q0018","k":"POST","f":"MTT/CASH","p":"CO","s":"100bb","h":"AsQd","b":"Jh7h4c 2s","ok":0,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Du eröffnest vom Cutoff, der BB callt. Flop Jh 7h 4c, du c-bettest 1/3 Pot, er callt. Turn 2s, er checkt.","Er hat den Flop gecallt, also hat er meist ein Paar oder einen Draw. Die 2 ändert nichts. Mit Ass-hoch ohne Draw gewinnst du mit einer zweiten Bet zu wenig Folds und riskierst zu viel. Check, du hast Showdown-Value gegen seine verpassten Draws.","Zweite Bet ohne Hand und ohne Verbesserung: meist aufgeben."],"en":["You open from the cutoff, the BB calls. Flop Jh 7h 4c, you c-bet 1/3 pot, he calls. Turn 2s, he checks.","He called the flop, so he usually has a pair or a draw. The deuce changes nothing. With ace-high and no draw a second bet gets too few folds and risks too much. Check, you have showdown value against his missed draws.","Second barrel with no hand and no improvement: usually give up."],"ro":["Deschizi de pe cutoff, BB dă call. Flop Jh 7h 4c, dai c-bet 1/3 pot, el dă call. Turn 2s, el dă check.","A dat call pe flop, deci de obicei are o pereche sau un draw. Doiul nu schimbă nimic. Cu ace-high fără draw, un al doilea bet ia prea puține fold-uri și riscă prea mult. Check, ai showdown value contra draw-urilor lui ratate.","Al doilea bet fără mână și fără îmbunătățire: de obicei renunță."]},"ch":false},{"id":"Q0024","k":"POST","f":"MTT/CASH","p":"BB","s":"100bb","h":"KsKd","b":"Qh9h4c Jh 6h","ok":0,"o":{"de":["Fold","Call","Raise"],"en":["Fold","Call","Raise"],"ro":["Fold","Call","Raise"]},"t":{"de":["Der BTN eröffnet, du 3-bettest im BB, er callt. Flop Qh 9h 4c, Bet, Call. Turn Jh, Check, Check. River 6h, du checkst, er bettet 3/4 Pot.","Vier Herzen auf dem Board, du hast keins. Du hast einen Turn und River gecheckt, und jetzt bettet er groß in einen Pot, in dem fast alles ihn schlagen könnte. Er hat mit jedem einzelnen Herz einen Flush. Deine Könige sind hier nur noch ein Bluff-Catcher gegen sehr wenige Bluffs. Fold.","Vier zur Farbe auf dem Board und große Bet: Overpair ist kein Grund zum Callen."],"en":["The BTN opens, you 3-bet in the BB, he calls. Flop Qh 9h 4c, bet, call. Turn Jh, check, check. River 6h, you check, he bets 3/4 pot.","Four hearts on the board and you have none. You checked turn and river, and now he bets big into a pot where almost anything beats you. He has a flush with any single heart. Your kings are only a bluff catcher against very few bluffs. Fold.","Four to a flush on board and a big bet: an overpair is no reason to call."],"ro":["BTN deschide, tu dai 3-bet pe BB, el dă call. Flop Qh 9h 4c, bet, call. Turn Jh, check, check. River 6h, dai check, el dă bet 3/4 pot.","Patru inimi pe board și tu n-ai niciuna. Ai dat check pe turn și river, iar acum el dă bet mare într-un pot unde aproape orice te bate. Are flush cu orice inimă. Regii tăi sunt doar un bluff catcher contra foarte puține bluff-uri. Fold.","Patru la culoare pe board și bet mare: un overpair nu e motiv de call."]},"ch":false},{"id":"Q0029","k":"POST","f":"MTT/CASH","p":"BB","s":"100bb","h":"AsKs","b":"Kd7c2h","ok":1,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Der BTN eröffnet, du 3-bettest im BB, er callt. Flop Kd 7c 2h, du bist zuerst dran. Im Pot liegen 20bb.","Top Pair Top Kicker im 3-Bet-Pot: Der Pot ist schon groß, die Stacks sind relativ dazu kurz. Eine kleine Bet (1/3) reicht, um seine Call-Range (Paare, Ax, Broadways) im Spiel zu halten und bis zum River trotzdem All-in zu kommen. Groß betten foldet seine schlechteren Hände.","3-Bet-Pot, gute Hand: klein betten, der Pot ist schon groß genug."],"en":["The BTN opens, you 3-bet in the BB, he calls. Flop Kd 7c 2h, you act first. The pot is 20bb.","Top pair top kicker in a 3-bet pot: the pot is already big and stacks are short relative to it. A small bet (1/3) is enough to keep his calling range (pairs, Ax, broadways) in and still get all-in by the river. Betting big folds his worse hands.","3-bet pot, good hand: bet small, the pot is already big enough."],"ro":["BTN deschide, tu dai 3-bet pe BB, el dă call. Flop Kd 7c 2h, tu acționezi primul. Potul are 20bb.","Top pair top kicker în pot de 3-bet: potul e deja mare, stack-urile sunt scurte relativ la el. Un bet mic (1/3) ajunge ca să ții în joc range-ul lui de call (perechi, Ax, broadway) și tot ajungi all-in până la river. Un bet mare face fold mâinile lui mai slabe.","Pot de 3-bet, mână bună: bet mic, potul e deja destul de mare."]},"ch":false},{"id":"Q0034","k":"POST","f":"MTT/CASH","p":"SB","s":"100bb","h":"AdQd","b":"Kh Th 4c","ok":1,"o":{"de":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"en":["Check","Bet 1/3 Pot","Bet 3/4 Pot"],"ro":["Check","Bet 1/3 Pot","Bet 3/4 Pot"]},"t":{"de":["Der CO eröffnet, du 3-bettest aus dem SB, er callt. Flop Kh Th 4c, du bist zuerst dran.","Kein Paar, aber Gutshot zum Nut-Straight (jeder Bube) und das Board trifft deine 3-Bet-Range (AK, KK, AA, KQ) stärker als seine Call-Range. Eine kleine C-Bet gewinnt oft sofort und ist billig, wenn er callt. Groß betten mit Ass-hoch ist zu teuer.","Range-Vorteil im 3-Bet-Pot: klein c-betten, auch ohne Treffer."],"en":["The CO opens, you 3-bet from the SB, he calls. Flop Kh Th 4c, you act first.","No pair, but a gutshot to the nut straight (any jack) and the board hits your 3-bet range (AK, KK, AA, KQ) harder than his calling range. A small c-bet often wins immediately and is cheap if he calls. Betting big with ace-high is too expensive.","Range advantage in a 3-bet pot: c-bet small, even without a hit."],"ro":["CO deschide, tu dai 3-bet din SB, el dă call. Flop Kh Th 4c, tu acționezi primul.","Fără pereche, dar gutshot la nut straight (orice J), iar boardul lovește range-ul tău de 3-bet (AK, KK, AA, KQ) mai tare decât range-ul lui de call. Un c-bet mic câștigă des imediat și e ieftin dacă el dă call. Bet mare cu ace-high e prea scump.","Avantaj de range în pot de 3-bet: c-bet mic, chiar și fără să lovești."]},"ch":false},{"id":"Q0039","k":"POST","f":"MTT/CASH","p":"BB","s":"100bb","h":"Th9d","b":"Qs Jh 3c","ok":1,"o":{"de":["Fold","Call","Raise"],"en":["Fold","Call","Raise"],"ro":["Fold","Call","Raise"]},"t":{"de":["Der HJ eröffnet, der BTN callt, du callst im BB. Flop Qs Jh 3c. Du checkst, der HJ bettet 1/2 Pot, der BTN callt.","Open-Ended Straight Draw (jeder K oder 8) gegen zwei Gegner. Mit Bet und Call liegt schon viel im Pot, du bekommst mehr als 3:1 und wirst bei einem Treffer von Qx- und Jx-Händen bezahlt. Ein Raise gegen zwei Spieler auf einem Board, das ihre Ranges trifft, ist zu riskant.","Guter Draw, guter Preis, mehrere Gegner: callen und treffen."],"en":["The HJ opens, the BTN calls, you call in the BB. Flop Qs Jh 3c. You check, the HJ bets 1/2 pot, the BTN calls.","Open-ended straight draw (any K or 8) against two opponents. With a bet and a call the pot is already big, you get more than 3:1 and will be paid by Qx and Jx hands when you hit. Raising against two players on a board that hits their ranges is too risky.","Good draw, good price, several opponents: call and hit."],"ro":["HJ deschide, BTN dă call, tu dai call pe BB. Flop Qs Jh 3c. Dai check, HJ dă bet 1/2 pot, BTN dă call.","Open-ended straight draw (orice K sau 8) contra a doi adversari. Cu bet și call potul e deja mare, primești peste 3:1 și vei fi plătit de mâinile cu Qx și Jx când lovești. Un raise contra a doi jucători pe un board care le lovește range-urile e prea riscant.","Draw bun, preț bun, mai mulți adversari: call și lovește."]},"ch":false},{"id":"P0002","k":"PUSH","f":"MTT","p":"UTG","s":"10bb","h":"Ts2s","b":"","ok":0,"o":{"de":["Fold","All-in","Raise 2,2bb"],"en":["Fold","All-in","Raise 2.2bb"],"ro":["Fold","All-in","Raise 2,2bb"]},"t":{"de":["Turnier, du hast nur noch 10bb, alle vor dir haben gefoldet. Du bist UTG.","Mit 10bb ist nur Push oder Fold sinnvoll, und T2s liegt außerhalb der Push-Range von UTG (etwa 14%). Ein kleines Raise bindet dich ohne Fold-Equity.","Unter 15bb: Push oder Fold, nie klein raisen."],"en":["Tournament, you are down to 10bb, everyone folded to you. You are in the UTG.","At 10bb only push or fold makes sense, and T2s is outside the UTG push range (about 14%). A small raise commits you without fold equity.","Under 15bb: push or fold, never min-raise."],"ro":["Turneu, mai ai doar 10bb, toți dinaintea ta au dat fold. Ești pe UTG.","La 10bb doar push sau fold are sens, iar T2s e în afara range-ului de push de pe UTG (cam 14%). Un raise mic te angajează fără fold equity.","Sub 15bb: push sau fold, niciodată raise mic."]},"ch":false},{"id":"P0005","k":"PUSH","f":"MTT","p":"UTG","s":"10bb","h":"AsKh","b":"","ok":1,"o":{"de":["Fold","All-in","Raise 2,2bb"],"en":["Fold","All-in","Raise 2.2bb"],"ro":["Fold","All-in","Raise 2,2bb"]},"t":{"de":["Turnier, du hast nur noch 10bb, alle vor dir haben gefoldet. Du bist UTG.","Mit 10bb gibt es kein Raise/Fold mehr, nur All-in oder Fold. AKo ist in der Push-Range von UTG (etwa 19% aller Hände).","Unter 15bb: Push oder Fold, nie klein raisen."],"en":["Tournament, you are down to 10bb, everyone folded to you. You are in the UTG.","At 10bb there is no raise/fold any more, only shove or fold. AKo is inside the UTG push range (about 19% of hands).","Under 15bb: push or fold, never min-raise."],"ro":["Turneu, mai ai doar 10bb, toți dinaintea ta au dat fold. Ești pe UTG.","La 10bb nu mai există raise/fold, doar all-in sau fold. AKo e în range-ul de push de pe UTG (cam 19% din mâini).","Sub 15bb: push sau fold, niciodată raise mic."]},"ch":false},{"id":"P0008","k":"PUSH","f":"MTT","p":"MP","s":"10bb","h":"Qc9s","b":"","ok":0,"o":{"de":["Fold","All-in","Raise 2,2bb"],"en":["Fold","All-in","Raise 2.2bb"],"ro":["Fold","All-in","Raise 2,2bb"]},"t":{"de":["Turnier, du hast nur noch 10bb, alle vor dir haben gefoldet. Du bist MP.","Mit 10bb ist nur Push oder Fold sinnvoll, und Q9o liegt außerhalb der Push-Range von MP (etwa 22%). Ein kleines Raise bindet dich ohne Fold-Equity.","Unter 15bb: Push oder Fold, nie klein raisen."],"en":["Tournament, you are down to 10bb, everyone folded to you. You are in the MP.","At 10bb only push or fold makes sense, and Q9o is outside the MP push range (about 22%). A small raise commits you without fold equity.","Under 15bb: push or fold, never min-raise."],"ro":["Turneu, mai ai doar 10bb, toți dinaintea ta au dat fold. Ești pe MP.","La 10bb doar push sau fold are sens, iar Q9o e în afara range-ului de push de pe MP (cam 22%). Un raise mic te angajează fără fold equity.","Sub 15bb: push sau fold, niciodată raise mic."]},"ch":false},{"id":"P0011","k":"PUSH","f":"MTT","p":"CO","s":"10bb","h":"Ah8s","b":"","ok":1,"o":{"de":["Fold","All-in","Raise 2,2bb"],"en":["Fold","All-in","Raise 2.2bb"],"ro":["Fold","All-in","Raise 2,2bb"]},"t":{"de":["Turnier, du hast nur noch 10bb, alle vor dir haben gefoldet. Du bist CO.","Mit 10bb gibt es kein Raise/Fold mehr, nur All-in oder Fold. A8o ist in der Push-Range von CO (etwa 33% aller Hände).","Unter 15bb: Push oder Fold, nie klein raisen."],"en":["Tournament, you are down to 10bb, everyone folded to you. You are in the CO.","At 10bb there is no raise/fold any more, only shove or fold. A8o is inside the CO push range (about 33% of hands).","Under 15bb: push or fold, never min-raise."],"ro":["Turneu, mai ai doar 10bb, toți dinaintea ta au dat fold. Ești pe CO.","La 10bb nu mai există raise/fold, doar all-in sau fold. A8o e , J8o ist locker dabei."],"en":["Spin & Go, heads-up, you have 8bb in the SB (button).","With 8bb heads-up almost every hand is a push: J8o has enough equity against the BB's calling range, and he folds often enough that you pick up the blinds. Limping 8bb without a plan gives up fold equity, folding gives up a profitable hand.","Heads-up under 10bb: push almost everything, J8o is easily in."],"ro":["Spin & Go, heads-up, ai 8bb pe SB (button).","Cu 8bb heads-up aproape orice mână e push: J8o are destulă equity contra range-ului de call al BB-ului, iar el dă fold destul de des ca să iei blind-urile. Limp cu 8bb fără plan renunță la fold equity, fold-ul renunță la o mână profitabilă.","Heads-up sub 10bb: push cu aproape orice, J8o e clar inclus."]},"ch":false},{"id":"Q0044","k":"SPIN","f":"SPIN","p":"BB","s":"10bb","h":"Ad9c","b":"","ok":1,"o":{"de":["Fold","Call"],"en":["Fold","Call"],"ro":["Fold","Call"]},"t":{"de":["Spin & Go, Heads-up, 10bb effektiv. Der Button geht All-in, du bist im BB mit A9o.","Heads-up pusht der Button mit 10bb extrem weit, oft 60 bis 80% aller Hände. A9o hat gegen diese Range über 55% Equity, und du bekommst gute Odds, weil dein Big Blind schon im Pot liegt. Klarer Call.","Gegen breite Heads-up-Pushes: Ax bis tief runter callen."],"en":["Spin & Go, heads-up, 10bb effective. The button shoves, you are in the BB with A9o.","Heads-up the button pushes extremely wide at 10bb, often 60 to 80% of hands. A9o has over 55% equity against that range, and you get good odds because your big blind is already in the pot. Clear call.","Against wide heads-up shoves: call Ax a long way down."],"ro":["Spin & Go, heads-up, 10bb efectiv. Buttonul dă all-in, tu ești pe BB cu A9o.","Heads-up buttonul dă push extrem de larg la 10bb, adesea 60 până la 80% din mâini. A9o are peste 55% equity contra acestui range și primești cote bune pentru că big blind-ul tău e deja în pot. Call clar.","Contra push-urilor largi heads-up: call cu Ax destul de jos."]},"ch":false},{"id":"Q0045","k":"SPIN","f":"SPIN","p":"BTN","s":"25bb","h":"6h5h","b":"","ok":1,"o":{"de":["Fold","Raise 2bb","All-in"],"en":["Fold","Raise 2bb","All-in"],"ro":["Fold","Raise 2bb","All-in"]},"t":{"de":["Spin & Go, 3-handed, 25bb, erste Hand. Du bist am Button, beide Blinds haben noch nicht gehandelt.","Am Button 3-handed eröffnest du sehr weit, weil du Position auf beide Gegner hast. 65s ist eine klassische Min-Raise-Hand: spielbar, mit Flush- und Straight-Potenzial. All-in mit 25bb wäre viel zu viel Risiko für die Blinds, Fold verschenkt Value.","3-handed am Button mit 25bb: viel min-raisen, nicht pushen."],"en":["Spin & Go, 3-handed, 25bb, first hand. You are on the button, both blinds still to act.","On the button 3-handed you open very wide because you have position on both opponents. 65s is a classic min-raise hand: playable with flush and straight potential. All-in with 25bb risks far too much for the blinds, folding gives up value.","3-handed on the button with 25bb: min-raise a lot, do not shove."],"ro":["Spin & Go, 3-handed, 25bb, prima mână. Ești pe button, ambele blind-uri urmează să acționeze.","Pe button 3-handed deschizi foarte larg pentru că ai poziție pe ambii adversari. 65s e o mână clasică de min-raise: jucabilă, cu potențial de flush și chintă. All-in cu 25bb riscă mult prea mult pentru blind-uri, fold-ul renunță la value.","3-handed pe button cu 25bb: min-raise mult, nu push."]},"ch":false},{"id":"P0424","k":"SQUEEZE","f":"MTT","p":"MP","s":"40bb","h":"Qc4s","b":"","ok":0,"o":{"de":["Fold","Call","Squeeze (3-Bet)"],"en":["Fold","Call","Squeeze (3-bet)"],"ro":["Fold","Call","Squeeze (3-bet)"]},"t":{"de":["Turnier, 40bb effektiv. Ein Spieler eröffnet, ein zweiter callt. Du bist MP.","Gegen Open und Call ist Q4o zu schwach für einen Squeeze und zu schlecht zum Callen. Fold.","Open plus Caller: groß squeezen (etwa 4x) oder folden, Call nur mit spielbaren Händen."],"en":["Tournament, 40bb effective. One player opens, a second one calls. You are in the MP.","Against an open and a call, Q4o is too weak to squeeze and too poor to call. Fold.","Open plus caller: squeeze big (about 4x) or fold, call only with playable hands."],"ro":["Turneu, 40bb efectiv. Un jucător deschide, al doilea dă call. Ești pe MP.","Contra open și call, Q4o e prea slabă pentru squeeze și prea slabă pentru call. Fold.","Open plus caller: squeeze mare (cam 4x) sau fold, call doar cu mâini jucabile."]},"ch":false},{"id":"P0427","k":"SQUEEZE","f":"MTT","p":"HJ","s":"40bb","h":"KhKc","b":"","ok":2,"o":{"de":["Fold","Call","Squeeze (3-Bet)"],"en":["Fold","Call","Squeeze (3-bet)"],"ro":["Fold","Call","Squeeze (3-bet)"]},"t":{"de":["Turnier, 40bb effektiv. Ein Spieler eröffnet, ein zweiter callt. Du bist HJ.","Open plus Caller ist ein Squeeze-Spot. KK ist stark genug oder hat die richtigen Blocker, um zu squeezen. Der Pot ist schon groß, und zwei Gegner müssen beide weiterspielen.","Open plus Caller: groß squeezen (etwa 4x) oder folden, Call nur mit spielbaren Händen."],"en":["Tournament, 40bb effective. One player opens, a second one calls. You are in the HJ.","Open plus caller is a squeeze spot. KK is strong enough or has the right blockers to squeeze. The pot is already big and two opponents both have to continue.","Open plus caller: squeeze big (about 4x) or fold, call only with playable hands."],"ro":["Turneu, 40bb efectiv. Un jucător deschide, al doilea dă call. Ești pe HJ.","Open plus caller e un spot de squeeze. KK e destul de tare sau are blockerele potrivite pentru squeeze. Potul e deja mare și doi adversari trebuie amândoi să continue.","Open plus caller: squeeze mare (cam 4x) sau fold, call doar cu mâini jucabile."]},"ch":false},{"id":"P0430","k":"SQUEEZE","f":"MTT","p":"CO","s":"90bb","h":"Kh4h","b":"","ok":0,"o":{"de":["Fold","Call","Squeeze (3-Bet)"],"en":["Fold","Call","Squeeze (3-bet)"],"ro":["Fold","Call","Squeeze (3-bet)"]},"t":{"de":["Turnier, 90bb effektiv. Ein Spieler eröffnet, ein zweiter callt. Du bist CO.","Gegen Open und Cal  Limper im BB: Raise mit Value, Check mit dem Rest, nie folden."],"en":["Tournament, 20-25bb effective. One player limps, everyone else folds. You are in the BB.","Q2o is not strong enough to raise against a limp, but the flop is free: check and play on cheaply.","Versus a limper in the BB: raise value, check the rest, never fold."],"ro":["Turneu, 20-25bb efectiv. Un jucător dă limp, restul fold. Ești pe BB.","Q2o nu e destul de tare pentru raise contra unui limp, dar flopul e gratis: check și joacă mai departe ieftin.","Contra limper pe BB: raise cu value, check cu restul, niciodată fold."]},"ch":false},{"id":"P0453","k":"VSLIMP","f":"MTT","p":"BB","s":"20-25bb","h":"5c5d","b":"","ok":2,"o":{"de":["Check","Raise 3,5bb","All-in"],"en":["Check","Raise 3.5bb","All-in"],"ro":["Check","Raise 3,5bb","All-in"]},"t":{"de":["Turnier, 20-25bb effektiv. Ein Spieler limpt, alle anderen folden. Du bist im BB.","Mit 20-25bb und 55 ist gegen einen Limper das All-in am stärksten: maximale Fold-Equity gegen eine Range, die viel Schwaches limpt.","Gegen Limper im BB: Raise mit Value, Check mit dem Rest, nie folden."],"en":["Tournament, 20-25bb effective. One player limps, everyone else folds. You are in the BB.","At 20-25bb with 55 shoving over a limper is the strongest play: maximum fold equity against a range that limps a lot of junk.","Versus a limper in the BB: raise value, check the rest, never fold."],"ro":["Turneu, 20-25bb efectiv. Un jucător dă limp, restul fold. Ești pe BB.","La 20-25bb cu 55 all-in-ul peste limper e cea mai tare mutare: fold equity maximă contra unui range care dă limp cu multe mâini slabe.","Contra limper pe BB: raise cu value, check cu restul, niciodată fold."]},"ch":false},{"id":"P0454","k":"VSLIMP","f":"MTT","p":"BB","s":"30-40bb","h":"Ks9s","b":"","ok":1,"o":{"de":["Check","Raise 3,5bb","All-in"],"en":["Check","Raise 3.5bb","All-in"],"ro":["Check","Raise 3,5bb","All-in"]},"t":{"de":["Turnier, 30-40bb effektiv. Ein Spieler limpt, alle anderen folden. D function T(k, ...a) {
  const t = TEXTE[k];
  const s = t ? t[SPRACHEN.indexOf(S.sprache)] : k;
  return a.length ? s.replace(/\{(\d)\}/g, (m, i) => a[+i]) : s;
}
const euro = x => Number(x).toLocaleString(S.sprache === "en" ? "en-GB" : S.sprache === "de" ? "de-DE" : "ro-RO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const PREISE = { RON: { monat: 99, halbjahr: 490, jahr: 777 }, EUR: { monat: 19.99, halbjahr: 99.99, jahr: 159.99 } };
const PLAENE = ["monat", "halbjahr", "jahr"];
const MONATE = { monat: 1, halbjahr: 6, jahr: 12 };
const waehrung = () => S.sprache === "ro" ? "RON" : "EUR";
const geld = (b, w) => {
  const z = Number(b).toLocaleString(S.sprache === "en" ? "en-GB" : S.sprache === "de" ? "de-DE" : "ro-RO",
                                     { minimumFractionDigits: b % 1 ? 2 : 0, maximumFractionDigits: 2 });
  return w === "EUR" ? (S.sprache === "en" ? "€" + z : z + " €") : z + " " + w;
};
const spar = (p, w) => Math.round(100 * (1 - PREISE[w][p] / (PREISE[w].monat * MONATE[p])));
const preisListe = waehlbar => `<div class="plaene">${PLAENE.map(p => {
  const w = waehrung(), sp = spar(p, w);
  const inhalt = `${waehlbar ? `<input type="radio" name="plan" value="${p}" ${p === "jahr" ? "checked" : ""} />` : ""}
    <span class="plan-name">${T("plan." + p)}</span><b class="plan-preis">${geld(PREISE[w][p], w)}</b>${sp > 0 ? `<span class="spar">−${sp} %</span>` : ""}`;
  return waehlbar ? `<label class="plan ${p === "jahr" ? "bester" : ""}">${inhalt}</label>` : `<div class="plan ${p === "jahr" ? "bester" : ""}">${inhalt}</div>`;
}).join("")}</div>`;
const aufrunden = x => Math.ceil(Math.round(x * 10000) / 100) / 100;
const datum = ms => { const d = new Date(ms); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear(); };
const zeit = ms => { const d = new Date(ms); return datum(ms) + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const TAG = 86400000;
function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("zeigen");
  clearTimeout(toast.uhr); toast.uhr = setTimeout(() => t.classList.remove("zeigen"), 3200);
}
